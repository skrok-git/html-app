const box=document.getElementById('unlockBox'),pw=document.getElementById('unlockPassword'),remember=document.getElementById('unlockRemember'),button=document.getElementById('unlockButton'),status=document.getElementById('unlockStatus');
const from64=s=>Uint8Array.from(atob(s),x=>x.charCodeAt(0));
const to64=buffer=>{let s='';for(const b of new Uint8Array(buffer))s+=String.fromCharCode(b);return btoa(s)};
function forget(){try{localStorage.removeItem(KEY_STORE)}catch(_){}}
function busy(on){button.disabled=on;pw.disabled=on;button.textContent=on?'開いています…':'開く'}
async function decrypt(key){return new TextDecoder('utf-8',{fatal:true}).decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:from64(DATA.iv)},key,from64(DATA.ct)))}
function show(source){pw.value='';document.open();document.write(source);document.close()}
async function unlock(){if(button.disabled)return;if(!pw.value){status.textContent='パスワードを入力してください。';pw.focus();return}if(!globalThis.crypto?.subtle){status.textContent='この環境では暗号化機能を利用できません。HTTPSのURLをブラウザで開いてください。';return}busy(true);status.textContent='';
try{const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw.value),'PBKDF2',false,['deriveKey']);pw.value='';const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:from64(DATA.salt),iterations:DATA.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},true,['decrypt']);const source=await decrypt(key);if(remember.checked){try{localStorage.setItem(KEY_STORE,to64(await crypto.subtle.exportKey('raw',key)))}catch(_){}}else forget();show(source)}catch(_){forget();status.textContent='パスワードが違うか、ファイルが破損しています。';busy(false);pw.focus()}}

async function start(){const url=new URL(location.href);if(url.searchParams.get('lock')==='1'){forget();url.searchParams.delete('lock');try{history.replaceState(null,'',url.href)}catch(_){}pw.focus();return}let cached;try{cached=localStorage.getItem(KEY_STORE)}catch(_){}if(cached&&globalThis.crypto?.subtle){busy(true);try{const key=await crypto.subtle.importKey('raw',from64(cached),{name:'AES-GCM'},false,['decrypt']);const source=await decrypt(key);show(source);return}catch(_){forget();busy(false);status.textContent='記憶した解除情報が使えません。パスワードを入力してください。'}}pw.focus()}
