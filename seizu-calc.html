<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>一級建築士製図電卓</title>
<style>
:root { --text:#2C2C2B; --text-2:#7D7A75; --canvas:#FFFFFF; --surface:#F9F8F7; --border:#E6E5E3; --blue:#2783DE; --blue-soft:#E5F2FC; --red:#E56458; }
@media (prefers-color-scheme: dark) { :root { --text:#FFFFFF; --text-2:rgba(255,255,255,0.65); --canvas:#191919; --surface:#202020; --border:rgba(255,255,255,0.20); --blue:#5E9FE8; --blue-soft:rgba(94,159,232,0.12); --red:#E97366; } }
* { box-sizing:border-box; }
body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Noto Sans JP",sans-serif; background:var(--canvas); color:var(--text); display:flex; min-height:100vh; align-items:center; justify-content:center; padding:20px; }
.box { width:100%; max-width:360px; background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:28px 24px; }
h1 { font-size:18px; margin:0 0 4px; }
p.sub { margin:0 0 18px; font-size:13px; color:var(--text-2); }
input[type=password] { width:100%; font:inherit; font-size:16px; color:var(--text); background:var(--canvas); border:1px solid var(--border); border-radius:8px; padding:10px 12px; min-height:44px; }
input:focus { outline:2px solid var(--blue); outline-offset:-1px; border-color:var(--blue); }
button { width:100%; margin-top:12px; font:inherit; font-size:15px; font-weight:600; color:#fff; background:var(--blue); border:none; border-radius:8px; min-height:44px; cursor:pointer; }
label.remember { display:flex; align-items:center; gap:8px; margin-top:12px; font-size:13px; color:var(--text-2); cursor:pointer; }
label.remember input { accent-color:var(--blue); width:16px; height:16px; min-height:0; }
#err { display:none; margin-top:10px; font-size:13px; color:var(--red); font-weight:600; }
</style>
</head>
<body>
<div class="box">
  <h1>一級建築士製図電卓</h1>
  <p class="sub">このページはパスワードで保護されています</p>

    <label class="remember"><input type="checkbox" id="rem"> このブラウザで記憶する（次回から入力不要）</label>
    <button type="submit" id="btn">開く</button>
    <p id="err">パスワードが違います</p>
  </form>
</div>

var KEY_STORE = "seizu-calc-v3-key";
function b64ToBuf(b64){ var bin=atob(b64), a=new Uint8Array(bin.length); for(var i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i); return a; }
function bufToB64(buf){ var a=new Uint8Array(buf), s=""; for(var i=0;i<a.length;i++)s+=String.fromCharCode(a[i]); return btoa(s); }
function deriveKey(pw){
  return crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]).then(function(base){
    return crypto.subtle.deriveKey({name:"PBKDF2", salt:b64ToBuf(DATA.salt), iterations:DATA.iter, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, true, ["decrypt"]);
  });
}
function decryptWith(key){
  return crypto.subtle.decrypt({name:"AES-GCM", iv:b64ToBuf(DATA.iv)}, key, b64ToBuf(DATA.ct)).then(function(pt){
    return new TextDecoder().decode(pt);
  });
}
function doShow(html){ document.open(); document.write(html); document.close(); }
function show(html){
  if(document.readyState === "loading"){ document.addEventListener("DOMContentLoaded", function(){ doShow(html); }); }
  else { doShow(html); }
}
function tryStored(){
  var raw = null;
  try { raw = localStorage.getItem(KEY_STORE); } catch(e){}
  if(!raw) return;
  var box = document.querySelector(".box");
  box.style.visibility = "hidden"; // 自動復号中はロック画面を隠す（失敗時のみ再表示）
  crypto.subtle.importKey("raw", b64ToBuf(raw), {name:"AES-GCM"}, false, ["decrypt"]).then(decryptWith).then(show)["catch"](function(){ try{ localStorage.removeItem(KEY_STORE); }catch(e){} box.style.visibility = ""; });
}
document.getElementById("f").addEventListener("submit", function(ev){
  ev.preventDefault();
  var err = document.getElementById("err");
  err.style.display = "none";
  var remember = document.getElementById("rem").checked;
  deriveKey(document.getElementById("pw").value).then(function(key){
    return decryptWith(key).then(function(html){
      if(remember){
        return crypto.subtle.exportKey("raw", key).then(function(rawKey){
          try { localStorage.setItem(KEY_STORE, bufToB64(rawKey)); } catch(e){}
          show(html);
        });
      }
      show(html);
    });
  })["catch"](function(){ err.style.display = "block"; });
});
tryStored();
})();
