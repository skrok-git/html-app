<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Airport Flip Clock v2 — Triptych</title>
<style>
  :root{
    --bg:#191919;
    --text:#e9e9e9;
    --muted:#7d7d7d;
    --red:#be443c;
    --blue:#4a86d8;
    --gold:#c9a24a;
    --gold-hi:#f1d58a;
    --bz1:#4a4a4a; --bz2:#1a1a1a; --bz3:#3a3a3a;
    --fc1:#2f2f2f; --fc2:#272727; --fc3:#1e1e1e;
    --card1:#333; --card2:#262626;
    --mark:#e9e9e9;
  }
  body.inv{
    --bg:#ffffff;
    --text:#272727;
    --muted:#8a8a8a;
    --bz1:#d6d6d6; --bz2:#f7f7f7; --bz3:#c6c6c6;
    --fc1:#f4f4f4; --fc2:#e9e9e9; --fc3:#dedede;
    --card1:#f2f2f2; --card2:#e2e2e2;
    --mark:#272727;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg)}
  body{
    font-family:"Helvetica Neue",Helvetica,Arial,"Noto Sans JP",sans-serif;
    color:var(--text);
    display:flex;align-items:center;justify-content:center;
    -webkit-font-smoothing:antialiased;
  }
  .stage{width:100%;max-width:1400px;container-type:inline-size;padding:1.5vh 0}
  .tri{--u:0.98cqw;display:flex;flex-direction:column;align-items:center}

  /* ===== 本体（3モジュール＋連結ブリッジ） ===== */
  .row{display:flex;align-items:center;justify-content:center}
  .bridge{
    width:calc(var(--u)*2.2);height:calc(var(--u)*3.4);
    background:linear-gradient(180deg,var(--bz1),var(--bz2) 55%,var(--bz3));
    box-shadow:inset 0 calc(var(--u)*.12) calc(var(--u)*.2) rgba(255,255,255,.06),
               inset 0 calc(var(--u)*-.12) calc(var(--u)*.2) rgba(0,0,0,.35);
    margin:0 calc(var(--u)*-.35); /* ベゼルに少し潜らせて一体化 */
    position:relative;z-index:0;
  }
  .bridge::after{ /* 中央の溝＝赤のアクセント線 */
    content:"";position:absolute;left:0;right:0;top:50%;
    height:calc(var(--u)*.28);transform:translateY(-50%);
    background:var(--red);opacity:.85;
  }
  .dialbox{width:calc(var(--u)*25);height:calc(var(--u)*25);position:relative;z-index:1}
  .dialbox svg{width:100%;height:100%;display:block;overflow:visible}

  /* ===== フリップ枠（アナログと同じベゼル素材） ===== */
  .flipbox{
    width:calc(var(--u)*43);height:calc(var(--u)*25);position:relative;z-index:1;
    border-radius:calc(var(--u)*6.2);
    padding:calc(var(--u)*1.12);
    background:linear-gradient(180deg,var(--bz1),var(--bz2) 50%,var(--bz3));
    box-shadow:0 calc(var(--u)*.5) calc(var(--u)*1.2) rgba(0,0,0,.35);
  }
  .flipface{
    width:100%;height:100%;border-radius:calc(var(--u)*5.1);
    background:linear-gradient(180deg,var(--fc1),var(--fc2) 50%,var(--fc3));
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:calc(var(--u)*1.25);position:relative;overflow:hidden;
  }
  .label{
    font-size:calc(var(--u)*1.05);letter-spacing:.34em;font-weight:600;
    color:var(--muted);text-transform:uppercase;display:flex;align-items:center;gap:.8em;
    margin-right:-.34em; /* 末尾の字間ぶんを相殺して見た目の中心を正す */
  }
  .label i{width:calc(var(--u)*.7);height:calc(var(--u)*.7);border-radius:50%;background:var(--red);display:inline-block}
  .time{display:flex;align-items:flex-end;gap:calc(var(--u)*.45)}
  .grp{display:flex;gap:calc(var(--u)*.4)}
  .colon{display:flex;flex-direction:column;justify-content:center;gap:calc(var(--u)*1.7);
         height:calc(var(--u)*9);padding:0 calc(var(--u)*.35)}
  .colon span{width:calc(var(--u)*.9);height:calc(var(--u)*.9);border-radius:50%;background:var(--red);
              animation:slowBlink 3.033s ease-in-out infinite}
  .sec{margin-left:calc(var(--u)*.6)}

  /* ----- フラップ ----- */
  .flap{--w:calc(var(--u)*5.8);--h:calc(var(--u)*9);--fs:calc(var(--u)*7.6);
        width:var(--w);height:var(--h);position:relative;perspective:calc(var(--u)*40);
        font-weight:700;font-size:var(--fs);color:var(--text);font-variant-numeric:tabular-nums}
  .flap.s{--w:calc(var(--u)*3.4);--h:calc(var(--u)*5.3);--fs:calc(var(--u)*4.4)}
  .flap.d{--w:calc(var(--u)*2.3);--h:calc(var(--u)*3.3);--fs:calc(var(--u)*2.4);font-weight:600}
  .flap.d.k{--w:calc(var(--u)*3.3);--fs:calc(var(--u)*2.1)}
  .flap.sat{color:var(--blue)} /* 土曜＝青 */
  .flap.sun{color:var(--red)}  /* 日曜＝赤 */
  .half{position:absolute;left:0;right:0;height:50%;overflow:hidden;
        background:linear-gradient(180deg,var(--card1),var(--card2));backface-visibility:hidden}
  .half span{position:absolute;left:0;right:0;height:var(--h);line-height:var(--h);text-align:center}
  .top,.ft{top:0;border-radius:calc(var(--u)*.45) calc(var(--u)*.45) 0 0;transform-origin:50% 100%}
  .top span,.ft span{top:0}
  .bot,.fb{bottom:0;border-radius:0 0 calc(var(--u)*.45) calc(var(--u)*.45);transform-origin:50% 0;
           background:linear-gradient(180deg,var(--card2),var(--card1))}
  .bot span,.fb span{bottom:0}
  .flap::after{content:"";position:absolute;left:0;right:0;top:50%;height:calc(var(--u)*.12);
               transform:translateY(-50%);background:rgba(0,0,0,.55);z-index:5}
  body.inv .flap::after{background:rgba(0,0,0,.18)}
  .flap::before{content:"";position:absolute;inset:0;border-radius:calc(var(--u)*.45);
                box-shadow:0 calc(var(--u)*.25) calc(var(--u)*.4) rgba(0,0,0,.45);z-index:-1}
  body.inv .flap::before{box-shadow:0 calc(var(--u)*.2) calc(var(--u)*.35) rgba(0,0,0,.15)}
  .ft,.fb{z-index:3;display:none}
  .flap.go .ft{display:block;animation:flipFront .17s ease-in forwards}
  .flap.go .fb{display:block;transform:rotateX(90deg);animation:flipBack .17s ease-out .17s forwards}
  @keyframes flipFront{to{transform:rotateX(-90deg)}}
  @keyframes flipBack{to{transform:rotateX(0)}}

  .date{display:flex;align-items:center;gap:calc(var(--u)*.3)}
  .date .sep{width:calc(var(--u)*.5)}
  .era{font-size:calc(var(--u)*1.05);letter-spacing:.2em;color:var(--muted);margin-left:calc(var(--u)*.9)}

  /* ===== キャプション（3つ共通の書式） ===== */
  .caps{display:flex;justify-content:center;margin-top:calc(var(--u)*1.6)}
  .cap{font-size:calc(var(--u)*1.05);letter-spacing:.34em;font-weight:600;color:var(--muted);
       text-transform:uppercase;text-align:center;display:flex;justify-content:center;align-items:center;gap:.7em}
  .cap.c1,.cap.c3{width:calc(var(--u)*25)}
  .cap.c2{width:calc(var(--u)*43);margin:0 calc(var(--u)*1.5)}
  .cap b{color:var(--text);font-weight:700;letter-spacing:.12em;font-variant-numeric:tabular-nums}
  .cap .dot{width:calc(var(--u)*.7);height:calc(var(--u)*.7);border-radius:50%;background:#555;display:inline-block}
  .cap .dot.on{background:radial-gradient(circle at 35% 35%,var(--gold-hi),var(--gold));
               box-shadow:0 0 calc(var(--u)*.8) rgba(201,162,74,.7)}
  .cap .dot.alarm{animation:goldPulse 2.8s ease-in-out infinite}

  /* ===== ポモドーロ ===== */
  #pomo{cursor:pointer;touch-action:none}
  #knob{cursor:pointer}
  #pomo.done #pFace{animation:dialFlash 1.167s ease-in-out infinite}
  @keyframes dialFlash{50%{filter:brightness(1.9)}}
  @keyframes slowBlink{0%,100%{opacity:1}50%{opacity:.25}}
  @keyframes goldPulse{0%,100%{opacity:1}50%{opacity:.2}}

  /* ===== 狭い幅では縦積み ===== */
  @container (max-width:560px){
    .tri{--u:2.05cqw}
    .row{flex-direction:column}
    .bridge{width:calc(var(--u)*3.4);height:calc(var(--u)*2.2);margin:calc(var(--u)*-.35) 0}
    .bridge::after{left:50%;right:auto;top:0;bottom:0;height:auto;width:calc(var(--u)*.28);transform:translateX(-50%)}
    .caps{display:none}
    .row #m3{display:flex}
  }
  .mcap{display:none;margin:calc(var(--u)*.9) 0 calc(var(--u)*.4)}
  @media (prefers-reduced-motion:reduce){
    .colon span,.cap .dot.alarm,#pomo.done #pFace{animation:none}
  }
</style>
</head>
<body>
<div class="stage">
 <div class="tri">
  <div class="row">
    <!-- ANALOG -->
    <div class="dialbox">
      <svg viewBox="0 0 200 200" aria-label="アナログ時計">
        <defs>
          <linearGradient id="gBz" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" style="stop-color:var(--bz1)"/><stop offset=".5" style="stop-color:var(--bz2)"/><stop offset="1" style="stop-color:var(--bz3)"/>
          </linearGradient>
          <linearGradient id="gFc" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" style="stop-color:var(--fc1)"/><stop offset=".5" style="stop-color:var(--fc2)"/><stop offset="1" style="stop-color:var(--fc3)"/>
          </linearGradient>
          <filter id="handShadow" x="-50%" y="-50%" width="200%" height="200%">
            <feDropShadow dx="1.2" dy="2.4" stdDeviation="2.2" flood-opacity=".75"/>
          </filter>
          <path id="arc" d="M 18.7,129.6 A 86.5,86.5 0 0 0 181.3,129.6"/>
        </defs>
        <circle cx="100" cy="100" r="98" fill="url(#gBz)"/>
        <circle cx="100" cy="100" r="89.2" fill="url(#gFc)"/>
        <g id="aTicks"></g>
        <text font-size="5.7" letter-spacing=".5" font-weight="600" style="fill:var(--muted)">
          <textPath href="#arc" startOffset="50%" text-anchor="middle">SLOWDOWN YOU’RE DOING FINE</textPath>
        </text>
        <g filter="url(#handShadow)">
          <polygon id="hH" points="95.2,124 104.8,124 103.9,54 96.1,54" style="fill:var(--mark)"/>
          <polygon id="hM" points="95.2,124 104.8,124 103.9,20 96.1,20" style="fill:var(--mark)"/>
          <g id="hS" fill="#be443c">
            <rect x="98.9" y="44" width="2.2" height="80"/>
            <circle cx="100" cy="44" r="8.6"/>
          </g>
        </g>
        <circle cx="100" cy="100" r="4.4" fill="#be443c"/>
      </svg>
    </div>
    <div class="mcap cap" id="m1"></div>

    <div class="bridge"></div>

    <!-- FLIP -->
    <div class="flipbox">
      <div class="flipface">
        <div class="label" id="tzLabel"><i></i>Tokyo Local Time</div>
        <div class="time">
          <div class="grp" id="gH"></div>
          <div class="colon" id="colon"><span></span><span></span></div>
          <div class="grp" id="gM"></div>
          <div class="grp sec" id="gS"></div>
        </div>
        <div class="date">
          <div class="grp" id="gY"></div><div class="sep"></div>
          <div class="grp" id="gMo"></div><div class="sep"></div>
          <div class="grp" id="gD"></div><div class="sep"></div>
          <div class="grp" id="gW"></div>
          <div class="era" id="era"></div>
        </div>
      </div>
    </div>
    <div class="mcap cap" id="m2"></div>

    <div class="bridge"></div>

    <!-- POMODORO -->
    <div class="dialbox">
      <svg id="pomo" viewBox="0 0 200 200" aria-label="ポモドーロタイマー">
        <defs>
          <radialGradient id="gKnob" cx=".38" cy=".32" r=".8">
            <stop offset="0" style="stop-color:var(--bz1)"/><stop offset="1" style="stop-color:var(--bz2)"/>
          </radialGradient>
          <filter id="knobShadow" x="-50%" y="-50%" width="200%" height="200%">
            <feDropShadow dx="1.2" dy="2.4" stdDeviation="2.2" flood-opacity=".75"/>
          </filter>
        </defs>
        <circle cx="100" cy="100" r="98" fill="url(#gBz)"/>
        <circle id="pFace" cx="100" cy="100" r="89.2" fill="url(#gFc)"/>
        <path id="sector" fill="#be443c" fill-opacity=".92"/>
        <g id="pTicks"></g>
        <g id="pNums" font-size="8.6" font-weight="700" text-anchor="middle" dominant-baseline="central" style="fill:var(--mark)"></g>
        <g id="knob" filter="url(#knobShadow)">
          <circle cx="100" cy="100" r="15" fill="url(#gKnob)"/>
          <circle cx="100" cy="100" r="15" fill="none" style="stroke:var(--bz3)" stroke-width="1"/>
          <g id="kPlay" style="fill:var(--mark)"><polygon points="96,93 96,107 107,100"/></g>
          <g id="kPause" style="fill:var(--mark);display:none"><rect x="94.5" y="93" width="3.8" height="14"/><rect x="101.7" y="93" width="3.8" height="14"/></g>
        </g>
      </svg>
    </div>
    <div class="mcap cap" id="m3"></div>
  </div>

  <div class="caps">
    <div class="cap c1" id="c1"></div>
    <div class="cap c2" id="c2"></div>
    <div class="cap c3" id="c3"></div>
  </div>
 </div>
</div>

<script>
(() => {
  const tz = 'Asia/Tokyo';
  const NS = 'http://www.w3.org/2000/svg';
  if (new URLSearchParams(location.search).get('inv') === '1') document.body.classList.add('inv');

  /* ---------- フラップ ---------- */
  function makeFlap(parent, cls, ch){
    const f = document.createElement('div');
    f.className = 'flap ' + cls;
    f.innerHTML = '<div class="half top"><span></span></div><div class="half bot"><span></span></div>' +
                  '<div class="half ft"><span></span></div><div class="half fb"><span></span></div>';
    parent.appendChild(f);
    const s = f.querySelectorAll('span');
    s.forEach(x => x.textContent = ch);
    f._v = ch; f._s = s;
    return f;
  }
  function setFlap(f, ch){
    if (f._v === ch) return;
    const [top, bot, ft, fb] = f._s, old = f._v;
    top.textContent = ch; bot.textContent = old; ft.textContent = old; fb.textContent = ch;
    f.classList.remove('go'); void f.offsetWidth; f.classList.add('go');
    clearTimeout(f._t);
    f._t = setTimeout(() => { bot.textContent = ch; f.classList.remove('go'); }, 360);
    f._v = ch;
  }
  const mk = (id, n, cls) => Array.from({length:n}, () => makeFlap(document.getElementById(id), cls, '0'));
  const F = { H:mk('gH',2,''), M:mk('gM',2,''), S:mk('gS',2,'s'),
              Y:mk('gY',4,'d'), Mo:mk('gMo',2,'d'), D:mk('gD',2,'d'), W:mk('gW',1,'d k') };
  const put = (arr, str) => arr.forEach((f,i) => setFlap(f, str[i]));

  /* ---------- 時刻取得（JST固定） ---------- */
  const fmt = new Intl.DateTimeFormat('en-US',{timeZone:tz,hourCycle:'h23',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',weekday:'short'});
  const WJ = {Sun:'日',Mon:'月',Tue:'火',Wed:'水',Thu:'木',Fri:'金',Sat:'土'};
  function parts(d){ const o={}; fmt.formatToParts(d).forEach(p => o[p.type]=p.value); return o; }

  /* ---------- アナログ目盛 ---------- */
  const aT = document.getElementById('aTicks');
  for (let i=0;i<60;i++){
    const major = i%5===0, w = major?6.1:2.2, l = major?21:6.3;
    const r = document.createElementNS(NS,'rect');
    r.setAttribute('x',100-w/2); r.setAttribute('y',100-81); r.setAttribute('width',w); r.setAttribute('height',l);
    r.setAttribute('transform',`rotate(${i*6} 100 100)`); r.style.fill='var(--mark)';
    aT.appendChild(r);
  }
  const hH=document.getElementById('hH'), hM=document.getElementById('hM'), hS=document.getElementById('hS');
  function paintAnalog(p){
    const h=+p.hour%12, m=+p.minute, s=+p.second;
    hH.setAttribute('transform',`rotate(${h*30+m*.5+s/120} 100 100)`);
    hM.setAttribute('transform',`rotate(${m*6+s*.1} 100 100)`);
    hS.setAttribute('transform',`rotate(${s*6} 100 100)`);
  }

  /* ---------- キャプション ---------- */
  const cap = (id, html) => { const a=document.getElementById(id), b=document.getElementById('m'+id.slice(1)); a.innerHTML=html; b.innerHTML=html; };

  let lastSec = -1;
  function tickClock(){
    const p = parts(new Date());
    if (+p.second === lastSec) return;
    lastSec = +p.second;
    put(F.H,p.hour); put(F.M,p.minute); put(F.S,p.second);
    put(F.Y,p.year); put(F.Mo,p.month); put(F.D,p.day); setFlap(F.W[0],WJ[p.weekday]);
    F.W[0].classList.toggle('sat',p.weekday==='Sat'); F.W[0].classList.toggle('sun',p.weekday==='Sun');
    document.getElementById('era').textContent = `［ 令和${+p.year-2018}年 ］`;
    paintAnalog(p);
    cap('c1', 'Analog ・ JST');
    cap('c2', `${p.weekday} ・ Split-Flap Board`);
  }

  /* ---------- ポモドーロ ---------- */
  const pomo=document.getElementById('pomo'), sector=document.getElementById('sector'),
        pT=document.getElementById('pTicks'), pN=document.getElementById('pNums'),
        kPlay=document.getElementById('kPlay'), kPause=document.getElementById('kPause');
  const R=67.7, rOut=65.4, rt=76;
  for (let i=0;i<60;i++){
    const major=i%5===0, rIn=major?56.2:60.2, a=i*6*Math.PI/180;
    const ln=document.createElementNS(NS,'line');
    ln.setAttribute('x1',100+rIn*Math.sin(a)); ln.setAttribute('y1',100-rIn*Math.cos(a));
    ln.setAttribute('x2',100+rOut*Math.sin(a)); ln.setAttribute('y2',100-rOut*Math.cos(a));
    ln.setAttribute('stroke-width',major?2.6:1); ln.setAttribute('stroke-opacity',major?1:.9);
    ln.style.stroke='var(--mark)'; pT.appendChild(ln);
    if (major){
      const t=document.createElementNS(NS,'text');
      t.setAttribute('x',100+rt*Math.sin(a)); t.setAttribute('y',100-rt*Math.cos(a));
      t.textContent=i; pN.appendChild(t);
    }
  }
  let setMin=25, remain=25*60, running=false, endAt=0, done=false;
  function drawSector(sec){
    const frac=Math.min(sec/3600,1);
    if (frac<=0){ sector.setAttribute('d',''); return; }
    if (frac>=.9999){ sector.setAttribute('d',`M100,${100-R} A${R},${R} 0 1 1 99.99,${100-R} Z`); return; }
    const a=frac*2*Math.PI, x=100+R*Math.sin(a), y=100-R*Math.cos(a);
    sector.setAttribute('d',`M100,100 L100,${100-R} A${R},${R} 0 ${frac>.5?1:0} 1 ${x},${y} Z`);
  }
  const mmss = s => `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
  function paintPomo(){
    const s=Math.max(0,Math.ceil(remain));
    drawSector(s);
    kPlay.style.display=running?'none':''; kPause.style.display=running?'':'none';
    const st = done?'Done':running?'Focus':(s===setMin*60?'Ready':'Paused');
    const dot = `<span class="dot ${running||done?'on':''} ${done?'alarm':''}"></span>`;
    cap('c3', `${dot}Pomodoro ・ <b>${mmss(s)}</b> ・ ${st}`);
  }
  function startTimer(){ if (remain<=0) remain=setMin*60; endAt=Date.now()+remain*1000; running=true; paintPomo(); }
  function pauseTimer(){ remain=Math.max(0,(endAt-Date.now())/1000); running=false; paintPomo(); }
  function stopFlash(){ done=false; pomo.classList.remove('done'); remain=setMin*60; paintPomo(); }
  function tickTimer(){
    if (!running) return;
    remain=(endAt-Date.now())/1000;
    if (remain<=0){ remain=0; running=false; done=true; pomo.classList.add('done'); }
    paintPomo();
  }
  function minutesFromPoint(ev){
    const b=pomo.getBoundingClientRect();
    const x=(ev.clientX-b.left)/b.width*200-100, y=(ev.clientY-b.top)/b.height*200-100;
    let deg=Math.atan2(x,-y)*180/Math.PI; if (deg<0) deg+=360;
    return Math.min(60,Math.max(1,Math.round(deg/6)||60));
  }
  function setFromPoint(ev){ setMin=minutesFromPoint(ev); running=false; remain=setMin*60; paintPomo(); }
  let dragging=false;
  pomo.addEventListener('pointerdown',ev=>{
    if (done){ stopFlash(); return; }
    if (ev.target.closest('#knob')) return;
    dragging=true; pomo.setPointerCapture(ev.pointerId); setFromPoint(ev);
  });
  pomo.addEventListener('pointermove',ev=>{ if(dragging) setFromPoint(ev); });
  pomo.addEventListener('pointerup',()=>{ dragging=false; });
  document.getElementById('knob').addEventListener('click',ev=>{
    ev.stopPropagation(); if (done) return; running?pauseTimer():startTimer();
  });

  /* ---------- ラベルの中心をコロンに合わせる ---------- */
  const tzLabel=document.getElementById('tzLabel'), colon=document.getElementById('colon'), face=document.querySelector('.flipface');
  function alignLabel(){
    const f=face.getBoundingClientRect(), c=colon.getBoundingClientRect();
    tzLabel.style.transform=`translateX(${(c.left+c.width/2)-(f.left+f.width/2)}px)`;
  }
  new ResizeObserver(alignLabel).observe(face);
  if (document.fonts) document.fonts.ready.then(alignLabel);

  tickClock(); paintPomo(); alignLabel();
  setInterval(()=>{ tickClock(); tickTimer(); }, 200);
})();
