<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Airport Flip Clock v2 — Triptych</title>
<style>
  :root{
    --bg:#191919;
    --text:#e9e9e9;
    --muted:#7d7d7d;
    --red:#be443c;
    --blue:#628EC4;
    --sun:#CB5C5C;
    --gold:#c9a24a;
    --gold-hi:#f1d58a;
    --bz1:#4a4a4a; --bz2:#1a1a1a; --bz3:#3a3a3a;
    --fc1:#2f2f2f; --fc2:#272727; --fc3:#1e1e1e;
    --card1:#333; --card2:#262626;
    --mark:#e9e9e9;
  }
  body.inv{
    --bz1:#b5b5b5; --bz2:#e5e5e5; --bz3:#c5c5c5;
    --fc1:#d0d0d0; --fc2:#d8d8d8; --fc3:#e1e1e1;
    --bg:#ffffff;
    --text:#272727;
    --muted:#8a8a8a;
    --card1:#f2f2f2; --card2:#e2e2e2;
    --mark:#272727;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg)}
  body{
    font-family:"Helvetica Neue",Helvetica,Arial,"Noto Sans JP",sans-serif;
    color:var(--text);
    display:flex;align-items:center;justify-content:center;
    -webkit-font-smoothing:antialiased;
  }
  .stage{width:100%;max-width:1400px;container-type:inline-size;padding:1.5vh 0}
  .tri{--u:0.98cqw;display:flex;flex-direction:column;align-items:center}

  /* ===== 本体（3モジュール＋連結ブリッジ） ===== */
  .row{display:flex;align-items:center;justify-content:center}
  .bridge{
    width:calc(var(--u)*2.2);height:calc(var(--u)*3.4);
    background:linear-gradient(180deg,var(--bz1),var(--bz2) 55%,var(--bz3));
    box-shadow:inset 0 calc(var(--u)*.12) calc(var(--u)*.2) rgba(255,255,255,.06),
               inset 0 calc(var(--u)*-.12) calc(var(--u)*.2) rgba(0,0,0,.35);
    margin:0 calc(var(--u)*-.35); /* ベゼルに少し潜らせて一体化 */
    position:relative;z-index:0;
  }
  .bridge::after{ /* 中央の溝＝赤のアクセント線 */
    content:"";position:absolute;left:0;right:0;top:50%;
    height:calc(var(--u)*.28);transform:translateY(-50%);
    background:var(--red);opacity:.85;
  }
  .dialbox{width:calc(var(--u)*25);height:calc(var(--u)*25);position:relative;z-index:1}
  .dialbox svg{width:100%;height:100%;display:block;overflow:visible}

  /* ===== フリップ枠（アナログと同じベゼル素材） ===== */
  .flipbox{
    width:calc(var(--u)*43);height:calc(var(--u)*25);position:relative;z-index:1;
    border-radius:calc(var(--u)*2.2);
    padding:calc(var(--u)*1.12);
    background:linear-gradient(160deg,var(--bz1) 2%,var(--bz2) 46%,var(--bz3) 98%);
    box-shadow:0 calc(var(--u)*1.25) calc(var(--u)*2.08) rgba(0,0,0,.6),inset 0 0 0 0 transparent;
  }
  body.inv .flipface{box-shadow:0 0 0 calc(var(--u)*.15) #ececec}
  body.inv .flipbox{box-shadow:0 calc(var(--u)*1.25) calc(var(--u)*2.08) rgba(0,0,0,.2)}
  .flipface{
    width:100%;height:100%;border-radius:calc(var(--u)*1.4);
    background:radial-gradient(120% 160% at 38% 26%,var(--fc1),var(--fc2) 62%,var(--fc3));
    box-shadow:0 0 0 calc(var(--u)*.15) #141414;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:calc(var(--u)*1.25);position:relative;overflow:hidden;
  }
  .label{
    font-size:calc(var(--u)*1.05);letter-spacing:.34em;font-weight:600;
    color:var(--muted);text-transform:uppercase;display:flex;align-items:center;gap:.8em;
    margin-right:-.34em; /* 末尾の字間ぶんを相殺して見た目の中心を正す */
  }
  .time{display:flex;align-items:flex-end;gap:calc(var(--u)*.45)}
  .grp{display:flex;gap:calc(var(--u)*.4)}
  .colon{display:flex;flex-direction:column;justify-content:center;gap:calc(var(--u)*1.7);
         height:calc(var(--u)*10.2);padding:0 calc(var(--u)*.5)}
  .colon span{width:calc(var(--u)*1);height:calc(var(--u)*1);border-radius:50%;
              background:radial-gradient(circle at 35% 28%,#fff1a8,#d4af37 42%,#8f6b18 100%);
              box-shadow:0 0 calc(var(--u)*1) rgba(255,215,104,.72),0 0 calc(var(--u)*.15) rgba(255,246,190,.95);
              animation:slowBlink 3.033s ease-in-out infinite}

  /* ----- フラップ ----- */
  .flap{--w:calc(var(--u)*6.6);--h:calc(var(--u)*10.2);--fs:calc(var(--u)*8.6);
        width:var(--w);height:var(--h);position:relative;perspective:calc(var(--u)*40);
        font-weight:700;font-size:var(--fs);color:var(--text);font-variant-numeric:tabular-nums}
  .flap.d{--w:calc(var(--u)*2.3);--h:calc(var(--u)*3.3);--fs:calc(var(--u)*2.4);font-weight:600}
  .flap.d.k{--w:calc(var(--u)*3.3);--fs:calc(var(--u)*2.1)}
  .flap.sat{color:var(--blue)} /* 土曜＝青 */
  .flap.sun{color:var(--sun)}  /* 日曜＝赤 */
  .half{position:absolute;left:0;right:0;height:50%;overflow:hidden;
        background:linear-gradient(180deg,var(--card1),var(--card2));backface-visibility:hidden}
  .half span{position:absolute;left:0;right:0;height:var(--h);line-height:var(--h);text-align:center}
  .top,.ft{top:0;border-radius:calc(var(--u)*.45) calc(var(--u)*.45) 0 0;transform-origin:50% 100%}
  .top span,.ft span{top:0}
  .bot,.fb{bottom:0;border-radius:0 0 calc(var(--u)*.45) calc(var(--u)*.45);transform-origin:50% 0;
           background:linear-gradient(180deg,var(--card2),var(--card1))}
  .bot span,.fb span{bottom:0}
  .flap::after{content:"";position:absolute;left:0;right:0;top:50%;height:calc(var(--u)*.12);
               transform:translateY(-50%);background:rgba(0,0,0,.55);z-index:5}
  body.inv .flap::after{background:rgba(0,0,0,.18)}
  .flap::before{content:"";position:absolute;inset:0;border-radius:calc(var(--u)*.45);
                box-shadow:0 calc(var(--u)*.25) calc(var(--u)*.4) rgba(0,0,0,.45);z-index:-1}
  body.inv .flap::before{box-shadow:0 calc(var(--u)*.2) calc(var(--u)*.35) rgba(0,0,0,.15)}
  .ft,.fb{z-index:3;display:none}
  .flap.go .ft{display:block;animation:flipFront .17s ease-in forwards}
  .flap.go .fb{display:block;transform:rotateX(90deg);animation:flipBack .17s ease-out .17s forwards}
  @keyframes flipFront{to{transform:rotateX(-90deg)}}
  @keyframes flipBack{to{transform:rotateX(0)}}

  .date{display:flex;align-items:center;gap:calc(var(--u)*.3)}
  .date .sep{width:calc(var(--u)*.5)}
  .datebox{display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*.7)}
  .era{font-size:calc(var(--u)*1.05);letter-spacing:.2em;margin-right:-.2em;font-weight:600;
     background:linear-gradient(180deg,#fff1a8 0%,#d4af37 55%,#8f6b18 100%);
     -webkit-background-clip:text;background-clip:text;color:transparent}


  /* ===== ポモドーロ ===== */
  @keyframes slowBlink{0%,100%{opacity:1}50%{opacity:.25}}
  @keyframes goldPulse{0%,100%{opacity:1}50%{opacity:.2}}

  /* ===== 狭い幅では縦積み ===== */
  @container (max-width:560px){
    .tri{--u:2.05cqw}
    .row{flex-direction:column}
    .bridge{width:calc(var(--u)*3.4);height:calc(var(--u)*2.2);margin:calc(var(--u)*-.35) 0}
    .bridge::after{left:50%;right:auto;top:0;bottom:0;height:auto;width:calc(var(--u)*.28);transform:translateX(-50%)}
  }
  @media (prefers-reduced-motion:reduce){
    .colon span,#knobGlow.on,.dial.done{animation:none}
  }

  /* ===== ver1と同じ陰影（文字盤360px基準の値を u に換算） ===== */
  .dialbox.analog{filter:drop-shadow(0 calc(var(--u)*1.32) calc(var(--u)*2.5) rgba(0,0,0,.65))}
  .dialbox.dial{filter:drop-shadow(0 calc(var(--u)*1.25) calc(var(--u)*2.08) rgba(0,0,0,.6));touch-action:none;user-select:none;cursor:pointer}
  body.inv .dialbox.analog{filter:drop-shadow(0 calc(var(--u)*1.32) calc(var(--u)*2.5) rgba(0,0,0,.22))}
  body.inv .dialbox.dial{filter:drop-shadow(0 calc(var(--u)*1.25) calc(var(--u)*2.08) rgba(0,0,0,.20))}
  .dial.done{animation:dialFlash 1.167s steps(1,end) infinite}
  @keyframes dialFlash{0%,49%{opacity:1}50%,100%{opacity:.18}}
  #knob{cursor:pointer}
  #knobGlow{opacity:0;transition:opacity .3s}
  #knobGlow.on{opacity:1;filter:drop-shadow(0 0 3px rgba(255,215,104,.72)) drop-shadow(0 0 .5px rgba(255,246,190,.95));
               animation:slowBlink 3.033s ease-in-out infinite}  /* 「：」と同じ色・テンポ */
  body.inv #analogBezel stop:nth-child(1),body.inv #dialBezel stop:nth-child(1){stop-color:#b5b5b5}
  body.inv #analogBezel stop:nth-child(2),body.inv #dialBezel stop:nth-child(2){stop-color:#e5e5e5}
  body.inv #analogBezel stop:nth-child(3),body.inv #dialBezel stop:nth-child(3){stop-color:#c5c5c5}
  body.inv #analogFace stop:nth-child(1),body.inv #dialFaceGrad stop:nth-child(1){stop-color:#d0d0d0}
  body.inv #analogFace stop:nth-child(2),body.inv #dialFaceGrad stop:nth-child(2){stop-color:#d8d8d8}
  body.inv #analogFace stop:nth-child(3),body.inv #dialFaceGrad stop:nth-child(3){stop-color:#e1e1e1}
  body.inv #analogFaceRing,body.inv #dialFace{stroke:#ececec}
  body.inv #analogTicks rect{fill:#272727}
  body.inv #analogArcLabel{fill:#272727}
  body.inv #handHour,body.inv #handMinute{fill:#272727}
  body.inv #sectorLip{stroke:#f2f2f2}
  body.inv #ticks line{stroke:#272727}
  body.inv #ticks text{fill:#272727}
  body.inv #knobHalo{fill:#2a2a2a}
  body.inv #knobFill stop:nth-child(1){stop-color:#929292}
  body.inv #knobFill stop:nth-child(2){stop-color:#d4d4d4}
  body.inv #knobFill stop:nth-child(3){stop-color:#fafafa}
  body.inv #knob{stroke:#c4c4c4}
</style>
</head>
<body>
<div class="stage">
 <div class="tri">
  <div class="row">
    <!-- ANALOG -->
    <div class="dialbox analog" role="img" aria-label="アナログ時計">
        <svg viewBox="0 0 200 200">
          <defs>
            <linearGradient id="analogBezel" x1="26%" y1="2%" x2="74%" y2="98%">
              <stop offset="0%" stop-color="#4a4a4a"></stop>
              <stop offset="46%" stop-color="#1a1a1a"></stop>
              <stop offset="100%" stop-color="#3a3a3a"></stop>
            </linearGradient>
            <radialGradient id="analogFace" cx="38%" cy="26%" r="92%">
              <stop offset="0%" stop-color="#2f2f2f"></stop>
              <stop offset="62%" stop-color="#272727"></stop>
              <stop offset="100%" stop-color="#1e1e1e"></stop>
            </radialGradient>
            <filter id="handShadow" x="-50%" y="-50%" width="200%" height="200%">
              <feDropShadow dx="1.2" dy="2.4" stdDeviation="2.2" flood-color="#000000" flood-opacity=".75"></feDropShadow>
            </filter>
          </defs>
          <circle cx="100" cy="100" r="98" fill="url(#analogBezel)"></circle>
          <circle id="analogFaceRing" cx="100" cy="100" r="89.2" fill="url(#analogFace)" stroke="#141414" stroke-width="1.2"></circle>
          <g id="analogTicks"></g>
          <g id="analogArcLabel" font-family="'Helvetica Neue', Helvetica, Arial, 'Liberation Sans', sans-serif" fill="#e9e9e9">
            <path id="analogArcText" d="M 18.7,129.6 A 86.5,86.5 0 0 0 181.3,129.6" fill="none"></path>
            <text font-size="5.7" font-weight="500" letter-spacing=".5">
              <textPath href="#analogArcText" startOffset="50%" text-anchor="middle">SLOWDOWN YOU’RE DOING FINE</textPath>
            </text>
          </g>
          <g filter="url(#handShadow)">
            <polygon id="handHour" points="95.2,110 104.8,110 103.4,54 96.6,54" fill="#e9e9e9"></polygon>
            <polygon id="handMinute" points="95.2,112 104.8,112 103.4,20 96.6,20" fill="#e9e9e9"></polygon>
            <g id="handSecond">
              <rect x="98.9" y="38" width="2.2" height="80" fill="#be443c"></rect>
              <circle cx="100" cy="44" r="8.6" fill="#be443c"></circle>
            </g>
            <circle cx="100" cy="100" r="4.4" fill="#be443c"></circle>
          </g>
        </svg>
    </div>

    <div class="bridge"></div>

    <!-- FLIP -->
    <div class="flipbox">
      <div class="flipface">
        <div class="label" id="tzLabel">Tokyo Local Time</div>
        <div class="time">
          <div class="grp" id="gH"></div>
          <div class="colon" id="colon"><span></span><span></span></div>
          <div class="grp" id="gM"></div>
        </div>
        <div class="datebox">
          <div class="date">
            <div class="grp" id="gY"></div><div class="sep"></div>
            <div class="grp" id="gMo"></div><div class="sep"></div>
            <div class="grp" id="gD"></div><div class="sep"></div>
            <div class="grp" id="gW"></div>
          </div>
          <div class="era" id="era"></div>
        </div>
      </div>
    </div>

    <div class="bridge"></div>

    <!-- POMODORO -->
    <div class="dialbox dial" id="dial" role="img" aria-label="ポモドーロタイマー">
        <svg viewBox="0 0 200 200">
          <defs>
            <!-- 赤面：へこんで見えるような内側の影 -->
            <radialGradient id="redSunk" cx="50%" cy="38%" r="72%">
              <stop offset="0%" stop-color="#B04E4E"></stop>
              <stop offset="62%" stop-color="#C05555"></stop>
              <stop offset="100%" stop-color="#D97070"></stop>
            </radialGradient>
            <filter id="innerShadow" x="-30%" y="-30%" width="160%" height="160%">
              <feOffset dx="1" dy="3.2" in="SourceAlpha" result="off"></feOffset>
              <feGaussianBlur in="off" stdDeviation="3.6" result="offBlur"></feGaussianBlur>
              <feComposite operator="out" in="SourceAlpha" in2="offBlur" result="inverse"></feComposite>
              <feFlood flood-color="#2e0f0f" flood-opacity=".82" result="shadowColor"></feFlood>
              <feComposite operator="in" in="shadowColor" in2="inverse" result="shadow"></feComposite>
              <feMerge>
                <feMergeNode in="SourceGraphic"></feMergeNode>
                <feMergeNode in="shadow"></feMergeNode>
              </feMerge>
            </filter>
            <!-- 中央ノブ：飛び出して見える立体感 -->
            <radialGradient id="knobFill" cx="34%" cy="26%" r="82%">
              <stop offset="0%" stop-color="#6d6d6d"></stop>
              <stop offset="45%" stop-color="#2b2b2b"></stop>
              <stop offset="100%" stop-color="#050505"></stop>
            </radialGradient>
            <!-- ベゼル・文字盤：アナログ時計と同じ厚み・色 -->
            <linearGradient id="dialBezel" x1="26%" y1="2%" x2="74%" y2="98%">
              <stop offset="0%" stop-color="#4a4a4a"></stop>
              <stop offset="46%" stop-color="#1a1a1a"></stop>
              <stop offset="100%" stop-color="#3a3a3a"></stop>
            </linearGradient>
            <radialGradient id="dialFaceGrad" cx="38%" cy="26%" r="92%">
              <stop offset="0%" stop-color="#2f2f2f"></stop>
              <stop offset="62%" stop-color="#272727"></stop>
              <stop offset="100%" stop-color="#1e1e1e"></stop>
            </radialGradient>
            <radialGradient id="knobGold" cx="35%" cy="28%" r="75%">
              <stop offset="0%" stop-color="#fff1a8"></stop><stop offset="42%" stop-color="#d4af37"></stop><stop offset="100%" stop-color="#8f6b18"></stop>
            </radialGradient>
            <filter id="knobShadow" x="-80%" y="-80%" width="260%" height="260%">
              <feDropShadow dx="0" dy="2.6" stdDeviation="2.2" flood-color="#000000" flood-opacity=".55"></feDropShadow>
            </filter>
          </defs>
          <circle id="dialBezelRing" cx="100" cy="100" r="98" fill="url(#dialBezel)"></circle>
          <circle id="dialFace" cx="100" cy="100" r="89.2" fill="url(#dialFaceGrad)" stroke="#141414" stroke-width="1.2"></circle>
          <path id="sector" fill="url(#redSunk)" filter="url(#innerShadow)" d=""></path>
          <path id="sectorLip" fill="none" stroke="#ffffff" stroke-opacity=".5" stroke-width="1.1" d="" pointer-events="none"></path>
          <g id="ticks"></g>
          <g filter="url(#knobShadow)">
            <circle id="knobHalo" cx="100" cy="100" r="12" fill="#d8d8d8" opacity=".35"></circle>
            <circle id="knob" cx="100" cy="100" r="11" fill="url(#knobFill)" stroke="#000000" stroke-width=".6"></circle>
            <circle id="knobGlow" cx="100" cy="100" r="11" fill="url(#knobGold)" pointer-events="none"></circle>
          </g>
        </svg>
    </div>
  </div>

 </div>
</div>

<script>
(() => {
  const tz = 'Asia/Tokyo';
  const NS = 'http://www.w3.org/2000/svg';
  if (new URLSearchParams(location.search).get('inv') === '1') document.body.classList.add('inv');

  /* ---------- フラップ ---------- */
  function makeFlap(parent, cls, ch){
    const f = document.createElement('div');
    f.className = 'flap ' + cls;
    f.innerHTML = '<div class="half top"><span></span></div><div class="half bot"><span></span></div>' +
                  '<div class="half ft"><span></span></div><div class="half fb"><span></span></div>';
    parent.appendChild(f);
    const s = f.querySelectorAll('span');
    s.forEach(x => x.textContent = ch);
    f._v = ch; f._s = s;
    return f;
  }
  function setFlap(f, ch){
    if (f._v === ch) return;
    const [top, bot, ft, fb] = f._s, old = f._v;
    top.textContent = ch; bot.textContent = old; ft.textContent = old; fb.textContent = ch;
    f.classList.remove('go'); void f.offsetWidth; f.classList.add('go');
    clearTimeout(f._t);
    f._t = setTimeout(() => { bot.textContent = ch; f.classList.remove('go'); }, 360);
    f._v = ch;
  }
  const mk = (id, n, cls) => Array.from({length:n}, () => makeFlap(document.getElementById(id), cls, '0'));
  const F = { H:mk('gH',2,''), M:mk('gM',2,''),
              Y:mk('gY',4,'d'), Mo:mk('gMo',2,'d'), D:mk('gD',2,'d'), W:mk('gW',1,'d k') };
  const put = (arr, str) => arr.forEach((f,i) => setFlap(f, str[i]));

  /* ---------- 時刻取得（JST固定） ---------- */
  const fmt = new Intl.DateTimeFormat('en-US',{timeZone:tz,hourCycle:'h23',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',weekday:'short'});
  const WJ = {Sun:'日',Mon:'月',Tue:'火',Wed:'水',Thu:'木',Fri:'金',Sat:'土'};
  function parts(d){ const o={}; fmt.formatToParts(d).forEach(p => o[p.type]=p.value); return o; }

  /* ---------- アナログ目盛（ver1と同一） ---------- */
  (function(){
    const g=document.getElementById('analogTicks'); let svg='';
    for (let i=0;i<60;i++){
      const major=i%5===0, w=major?6.1:2.2, h=major?21:6.3, yTop=100-81;
      svg+='<rect x="'+(100-w/2).toFixed(2)+'" y="'+yTop.toFixed(2)+'" width="'+w+'" height="'+h+'" fill="#e9e9e9"'+
           (major?'':' fill-opacity=".9"')+' transform="rotate('+(i*6)+' 100 100)"></rect>';
    }
    g.innerHTML=svg;
  })();
  const handHour=document.getElementById('handHour'), handMinute=document.getElementById('handMinute'), handSecond=document.getElementById('handSecond');
  function paintAnalog(p){
    const h=+p.hour%12, m=+p.minute, s=+p.second;
    handHour.setAttribute('transform','rotate('+((h+m/60)*30).toFixed(2)+' 100 100)');
    handMinute.setAttribute('transform','rotate('+((m+s/60)*6).toFixed(2)+' 100 100)');
    handSecond.setAttribute('transform','rotate('+(s*6).toFixed(2)+' 100 100)');
  }

  /* ---------- キャプション ---------- */

  let lastSec = -1;
  function tickClock(){
    const p = parts(new Date());
    if (+p.second === lastSec) return;
    lastSec = +p.second;
    put(F.H,p.hour); put(F.M,p.minute);
    put(F.Y,p.year); put(F.Mo,p.month); put(F.D,p.day); setFlap(F.W[0],WJ[p.weekday]);
    F.W[0].classList.toggle('sat',p.weekday==='Sat'); F.W[0].classList.toggle('sun',p.weekday==='Sun');
    document.getElementById('era').textContent = `［ 令和${+p.year-2018}年 ］`;
    paintAnalog(p);
  }

  /* ---------- ポモドーロ（ver1と同一の文字盤・操作） ---------- */
  const dial=document.getElementById('dial'), sector=document.getElementById('sector'),
        sectorLip=document.getElementById('sectorLip'), ticksG=document.getElementById('ticks'),
        knob=document.getElementById('knob'), knobGlow=document.getElementById('knobGlow');
  const R=67.7;
  (function buildTicks(){   // 反時計回り（ver1と同じ）
    let svg='';
    for (let m=0;m<60;m++){
      const rad=-m*6*Math.PI/180, major=m%5===0, rOut=65.4, rIn=major?56.2:60.2;
      const x1=100+rOut*Math.sin(rad), y1=100-rOut*Math.cos(rad), x2=100+rIn*Math.sin(rad), y2=100-rIn*Math.cos(rad);
      svg+='<line x1="'+x1.toFixed(2)+'" y1="'+y1.toFixed(2)+'" x2="'+x2.toFixed(2)+'" y2="'+y2.toFixed(2)+
           '" stroke="#e9e9e9" stroke-opacity="'+(major?1:.9)+'" stroke-width="'+(major?2:.8)+'"></line>';
      if (major){
        const rt=76, tx=100+rt*Math.sin(rad), ty=100-rt*Math.cos(rad);
        svg+='<text x="'+tx.toFixed(2)+'" y="'+ty.toFixed(2)+'" fill="#e9e9e9" font-size="13.2" font-weight="700" '+
             'text-anchor="middle" dominant-baseline="central" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">'+m+'</text>';
      }
    }
    ticksG.innerHTML=svg;
  })();
  let totalSec=25*60, remainSec=totalSec, running=false, endAt=0, dragging=false;
  function drawSector(sec){
    const mins=Math.max(0,Math.min(60,sec/60));
    if (mins<=0){ sector.setAttribute('d',''); sectorLip.setAttribute('d',''); return; }
    if (mins>=59.999){
      sector.setAttribute('d','M100,'+(100-R)+' A'+R+','+R+' 0 1,0 100,'+(100+R)+' A'+R+','+R+' 0 1,0 100,'+(100-R)+' Z');
      sectorLip.setAttribute('d',''); return;
    }
    const a=mins*6*Math.PI/180, x=100-R*Math.sin(a), y=100-R*Math.cos(a);
    sector.setAttribute('d','M100,100 L100,'+(100-R)+' A'+R+','+R+' 0 '+(mins*6>180?1:0)+',0 '+x.toFixed(2)+','+y.toFixed(2)+' Z');
    sectorLip.setAttribute('d','M100,100 L'+x.toFixed(2)+','+y.toFixed(2));
  }
  function renderTimer(){
    knobGlow.classList.toggle('on',running);   // 稼働中は黒丸を金色で点滅
    drawSector(remainSec);
  }
  function stopFlash(){ dial.classList.remove('done'); }
  function startTimer(){ if (remainSec<=0) remainSec=totalSec; running=true; endAt=Date.now()+remainSec*1000; stopFlash(); renderTimer(); }
  function pauseTimer(){ remainSec=Math.max(0,(endAt-Date.now())/1000); running=false; renderTimer(); }
  function tickTimer(){
    if (!running) return;
    remainSec=(endAt-Date.now())/1000;
    if (remainSec<=0){ remainSec=0; running=false; dial.classList.add('done'); }
    renderTimer();
  }
  function minutesFromPoint(ev){
    const r=dial.getBoundingClientRect(), dx=ev.clientX-(r.left+r.width/2), dy=ev.clientY-(r.top+r.height/2);
    let deg=Math.atan2(-dx,-dy)*180/Math.PI; if (deg<0) deg+=360;   // 反時計回り
    let mins=Math.round(deg/6); if (mins<=0) mins=60; return Math.min(60,mins);
  }
  function setFromPoint(ev){ totalSec=minutesFromPoint(ev)*60; remainSec=totalSec; running=false; stopFlash(); renderTimer(); }
  knob.addEventListener('pointerdown',ev=>{
    ev.stopPropagation(); ev.preventDefault();
    if (dial.classList.contains('done')){ stopFlash(); remainSec=totalSec; renderTimer(); return; }
    running?pauseTimer():startTimer();
  });
  dial.addEventListener('pointerdown',ev=>{
    if (dial.classList.contains('done')){ stopFlash(); remainSec=totalSec; renderTimer(); return; }
    dragging=true; dial.setPointerCapture&&dial.setPointerCapture(ev.pointerId); setFromPoint(ev);
  });
  dial.addEventListener('pointermove',ev=>{ if(dragging) setFromPoint(ev); });
  dial.addEventListener('pointerup',()=>{ dragging=false; });
  dial.addEventListener('pointercancel',()=>{ dragging=false; });

  /* ---------- ラベルの中心をコロンに合わせる ---------- */
  const tzLabel=document.getElementById('tzLabel'), colon=document.getElementById('colon'), face=document.querySelector('.flipface');
  function alignLabel(){
    const f=face.getBoundingClientRect(), c=colon.getBoundingClientRect();
    tzLabel.style.transform=`translateX(${(c.left+c.width/2)-(f.left+f.width/2)}px)`;
  }
  new ResizeObserver(alignLabel).observe(face);
  if (document.fonts) document.fonts.ready.then(alignLabel);

  tickClock(); renderTimer(); alignLabel();
  setInterval(()=>{ tickClock(); tickTimer(); }, 200);
})();
</script>
</body>
</html>
