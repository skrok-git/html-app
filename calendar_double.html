<style>
:root{color-scheme:light dark;--text:#2c2c2b;--muted:#68645f;--bg:#f9f8f7;--surface:#fff;--border:#b7b4ae;--accent:#1765a8;--error:#b5352f}
*{box-sizing:border-box}html{min-height:100%}body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px;font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
main{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:28px 24px}h1{font-size:20px;line-height:1.4;margin:0 0 8px;overflow-wrap:anywhere}p{margin:0 0 24px;color:var(--muted);font-size:14px}.field-label{display:block;font-weight:600;font-size:14px;margin-bottom:8px}input[type=password]{width:100%;min-height:48px;border:1px solid var(--border);border-radius:8px;padding:10px 12px;background:var(--surface);color:var(--text);font:inherit}button{font:600 16px/1.5 inherit;font-family:inherit;font-size:16px;min-height:48px;border:1px solid var(--accent);border-radius:8px;background:var(--accent);color:#fff;padding:10px 16px;width:100%;cursor:pointer}button:disabled{cursor:wait;opacity:.7}input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}.remember{display:flex;align-items:center;gap:10px;min-height:48px;margin:12px 0;font-size:14px}.remember input{width:20px;height:20px;accent-color:var(--accent);flex-shrink:0}.note{font-size:14px;line-height:1.5;margin:16px 0 0}#unlockStatus{color:var(--error);min-height:21px;font-size:14px;margin:12px 0 0}noscript{color:var(--error)}
@media(max-width:460px){body{padding:16px}main{padding:24px 20px}}
@media(prefers-color-scheme:dark){:root{--text:#fff;--muted:#bcbab7;--bg:#191919;--surface:#202020;--border:#77736e;--accent:#75b4f4;--error:#ff9a90}button{color:#191919}}

<main id="unlockBox">

const KEY_STORE="html-app-unlock:calendar_double.html:9I+88nGfj+tUIJGvRyIRTQ==";
const box=document.getElementById('unlockBox'),pw=document.getElementById('unlockPassword'),remember=document.getElementById('unlockRemember'),button=document.getElementById('unlockButton'),status=document.getElementById('unlockStatus');
const from64=s=>Uint8Array.from(atob(s),x=>x.charCodeAt(0));
const to64=buffer=>{let s='';for(const b of new Uint8Array(buffer))s+=String.fromCharCode(b);return btoa(s)};
function forget(){try{localStorage.removeItem(KEY_STORE)}catch(_){}}
function busy(on){button.disabled=on;pw.disabled=on;button.textContent=on?'開いています…':'開く'}
async function decrypt(key){return new TextDecoder('utf-8',{fatal:true}).decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:from64(DATA.iv)},key,from64(DATA.ct)))}
function show(source){pw.value='';document.open();document.write(source);document.close()}
async function unlock(){if(button.disabled)return;if(!pw.value){status.textContent='パスワードを入力してください。';pw.focus();return}if(!globalThis.crypto?.subtle){status.textContent='この環境では暗号化機能を利用できません。HTTPSのURLをブラウザで開いてください。';return}busy(true);status.textContent='';
try{const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw.value),'PBKDF2',false,['deriveKey']);pw.value='';const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:from64(DATA.salt),iterations:DATA.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},true,['decrypt']);const source=await decrypt(key);if(remember.checked){try{localStorage.setItem(KEY_STORE,to64(await crypto.subtle.exportKey('raw',key)))}catch(_){}}else forget();show(source)}catch(_){forget();status.textContent='パスワードが違うか、ファイルが破損しています。';busy(false);pw.focus()}}
button.addEventListener('click',unlock);pw.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing){e.preventDefault();unlock()}});
async function start(){const url=new URL(location.href);if(url.searchParams.get('lock')==='1'){forget();url.searchParams.delete('lock');try{history.replaceState(null,'',url.href)}catch(_){}pw.focus();return}let cached;try{cached=localStorage.getItem(KEY_STORE)}catch(_){}if(cached&&globalThis.crypto?.subtle){busy(true);try{const key=await crypto.subtle.importKey('raw',from64(cached),{name:'AES-GCM'},false,['decrypt']);const source=await decrypt(key);show(source);return}catch(_){forget();busy(false);status.textContent='記憶した解除情報が使えません。パスワードを入力してください。'}}pw.focus()}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',()=>setTimeout(start,0),{once:true});else setTimeout(start,0);
})();
