    <style>

      input[type="text"], input[type="password"] { width: 100%; box-sizing: border-box; font: inherit; font-size: 14.5px; padding: 9px 11px; border: 1px solid #d8dfe7; border-radius: 8px; }
      input[type="file"] { font: inherit; font-size: 13.5px; }
      button { margin-top: 22px; width: 100%; font: inherit; font-size: 15.5px; font-weight: 900; background: #e8590c; color: #fff; border: none; border-radius: 10px; padding: 13px; cursor: pointer; }
      button:disabled { opacity: 0.45; cursor: default; }
      #status { margin-top: 14px; font-size: 13.5px; line-height: 1.7; min-height: 1.7em; }
      .ok { color: #2b8a3e; font-weight: 700; }

  <body>
    <div class="card">
      <h1>🔐 html-app 暗号化ツール</h1>
      <p class="note">DB_.html-app の共通ルール用。平文のアプリHTMLを、既存方式（AES-256-GCM ＋ PBKDF2-SHA256／600,000回）のラッパーで暗号化し、配信用HTMLをダウンロードします。このページは通信を一切しません。パスワードはこのPCの中だけで使われ、保存も送信もされません。</p>

      <label for="fileInput">1. 平文のアプリHTMLファイル</label>
      <input type="file" id="fileInput" accept=".html,.htm,text/html" />

      <label for="outName">2. 出力ファイル名（GitHubに上げる名前）</label>
      <input type="text" id="outName" placeholder="task-breakdown-v0-3.html" />

      <label for="appTitle">3. アプリ名（解除画面のタイトル）</label>
      <input type="text" id="appTitle" placeholder="タスク分解 v0.3" />

      <label for="pw1">4. 共通パスワード</label>
      <input type="password" id="pw1" autocomplete="current-password" />

      <button id="go" disabled>暗号化してダウンロード</button>
      <div id="status"></div>
    </div>

      var plainText = null, plainName = "";
      var fileInput = document.getElementById("fileInput");
      var outName = document.getElementById("outName");
      var appTitle = document.getElementById("appTitle");
      var pw1 = document.getElementById("pw1");
      var go = document.getElementById("go"), statusEl = document.getElementById("status");

      function to64(buf) { var b = new Uint8Array(buf), s = ""; for (var i = 0; i < b.length; i++) s += String.fromCharCode(b[i]); return btoa(s); }
      function esc(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
      function refresh() { go.disabled = !(plainText !== null && outName.value.trim() && appTitle.value.trim() && pw1.value); }
      [outName, appTitle, pw1].forEach(function (el) { el.addEventListener("input", refresh); });

      fileInput.addEventListener("change", function () {
        var f = fileInput.files[0]; if (!f) return;
        var r = new FileReader();
        r.onload = function () {
          plainText = String(r.result); plainName = f.name;
          outName.value = f.name;
          var m = plainText.match(/<title>([^<]*)<\/title>/i);
          appTitle.value = m ? m[1].trim() : f.name.replace(/\.html?$/i, "");
          statusEl.innerHTML = "読み込みました：" + esc(f.name) + "（" + plainText.length + " 文字）";
          refresh();
        };
        r.readAsText(f);
      });

      go.addEventListener("click", async function () {
        statusEl.textContent = ""; go.disabled = true;
        try {
          if (!crypto || !crypto.subtle) { statusEl.innerHTML = '<span class="err">このブラウザでは WebCrypto が使えません（https か file:// で開いてください）。</span>'; go.disabled = false; return; }
          statusEl.textContent = "暗号化しています…（数秒かかります）";
          var salt = crypto.getRandomValues(new Uint8Array(16));
          var iv = crypto.getRandomValues(new Uint8Array(12));
          var base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw1.value), "PBKDF2", false, ["deriveKey"]);
          var key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: salt, iterations: 600000, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, true, ["encrypt", "decrypt"]);
          var ct = await crypto.subtle.encrypt({ name: "AES-GCM", iv: iv }, key, new TextEncoder().encode(plainText));
          // self-check: decrypt and compare before delivering
          var back = new TextDecoder("utf-8", { fatal: true }).decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: iv }, key, ct));
          if (back !== plainText) { statusEl.innerHTML = '<span class="err">自己確認に失敗しました。ダウンロードを中止します。</span>'; go.disabled = false; return; }
          var DATA = { v: 1, salt: to64(salt), iv: to64(iv), iter: 600000, ct: to64(ct) };
          var tmpl = new TextDecoder("utf-8").decode(Uint8Array.from(atob(TEMPLATE_B64), function (c) { return c.charCodeAt(0); }));
          var out = tmpl.split("%%DATA%%").join(JSON.stringify(DATA))
                        .split("%%KEYSTORE%%").join("html-app-unlock:" + outName.value.trim() + ":" + DATA.salt)
                        .split("%%TITLE%%").join(esc(appTitle.value.trim()));
          var blob = new Blob([out], { type: "text/html" });
          var a = document.createElement("a");
          a.href = URL.createObjectURL(blob); a.download = outName.value.trim();
          document.body.appendChild(a); a.click(); a.remove();
          setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
          pw1.value = "";
          statusEl.innerHTML = '<span class="ok">完了：' + esc(a.download) + ' をダウンロードしました。</span> 復号の自己確認も一致しています。このファイルを GitHub へアップロードしてください。';
        } catch (e) {
          statusEl.innerHTML = '<span class="err">失敗しました：' + esc(String(e && e.message || e)) + '</span>';
        }
        go.disabled = false;
      });
