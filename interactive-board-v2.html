<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>インタラクティブボード v2</title>
<style>
:root{--bg:#f9f8f7;--grid:#e6e5e3;--text:#2c2c2b;--muted:#7d7a75;--border:#e6e5e3;--blue:#2783de;--blue-soft:#e5f2fc;--green:#46a171;--green-soft:#e8f1ec;--orange:#d5803b;--orange-soft:#fbebde;--red:#e56458;--red-soft:#fce9e7;--shadow:0 1px 2px rgba(0,0,0,.06),0 8px 24px rgba(0,0,0,.06)}
*{box-sizing:border-box}html,body{height:100%;margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text);background:var(--bg);overflow:hidden}.app{height:100vh;display:grid;grid-template-rows:auto 1fr;min-height:420px}
header{height:58px;background:rgba(255,255,255,.88);backdrop-filter:blur(14px);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:10px 16px;gap:12px;z-index:5}.brand{display:flex;align-items:center;gap:10px;min-width:0}.dot{width:10px;height:10px;border-radius:50%;background:var(--blue);box-shadow:0 0 0 5px var(--blue-soft)}h1{font-size:16px;line-height:1.2;margin:0;font-weight:760;white-space:nowrap}.sub{font-size:12px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
button,input,textarea,select{font:inherit}button{border:1px solid var(--border);background:white;color:var(--text);border-radius:10px;min-height:36px;padding:0 12px;font-weight:650;font-size:13px;box-shadow:0 1px 1px rgba(0,0,0,.03);cursor:pointer}button:hover{border-color:#d5d3d0;background:#fbfbfa}.primary{background:var(--text);color:#fff;border-color:var(--text)}.primary:hover{background:#44413e;color:#fff}.ghost{color:var(--muted)}.zoom{min-width:54px;text-align:center;color:var(--muted);font-size:13px;font-weight:650}
.board-wrap{position:relative;overflow:hidden}.board{position:absolute;inset:0;overflow:hidden;touch-action:none;cursor:grab;background-color:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;background-position:var(--gx,0px) var(--gy,0px)}.stage{position:absolute;left:0;top:0;width:2400px;height:1500px;transform-origin:0 0}.card{position:absolute;width:var(--cw,240px);min-height:var(--ch,128px);border:1px solid var(--border);border-radius:14px;background:rgba(255,255,255,.94);box-shadow:var(--shadow);padding:14px 14px 18px;cursor:grab;user-select:none;transition:box-shadow .15s,border-color .15s,transform .15s}.card.dragging{cursor:grabbing;box-shadow:0 10px 36px rgba(0,0,0,.16);border-color:#cfcac4;transform:rotate(.4deg)}.card.selected{outline:2px solid var(--blue);outline-offset:2px}.top{display:flex;align-items:flex-start;gap:10px;margin-bottom:8px}.actions{margin-left:auto;display:flex;gap:6px;align-items:center}.tag{border:0;font-size:11px;font-weight:760;border-radius:7px;padding:4px 7px;line-height:1;min-height:0;box-shadow:none}.tag.blue{color:var(--blue);background:var(--blue-soft)}.tag.green{color:var(--green);background:var(--green-soft)}.tag.orange{color:var(--orange);background:var(--orange-soft)}.tag.red{color:var(--red);background:var(--red-soft)}.tag.gray{color:#6f6a65;background:#f0efed}.mini{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:#888;font-size:13px;padding:0;background:transparent;box-shadow:none}.mini:hover{background:#f4f3f2;color:#444}.title{font-weight:780;font-size:clamp(17px,calc(var(--cw,240px)/11),30px);line-height:1.1;margin:0 0 7px;white-space:pre-wrap;letter-spacing:-.02em}.body{font-size:13px;line-height:1.45;color:#5f5b56;margin:0;white-space:pre-wrap}.resize{position:absolute;right:8px;bottom:8px;width:18px;height:18px;border-radius:5px;cursor:nwse-resize;color:#aaa;display:grid;place-items:center;font-size:12px}.resize:hover{background:#f0efed;color:#666}
.hint{position:absolute;left:16px;bottom:14px;background:rgba(255,255,255,.9);border:1px solid var(--border);border-radius:12px;padding:9px 11px;font-size:12px;color:var(--muted);box-shadow:0 4px 16px rgba(0,0,0,.05);pointer-events:none}.panel{position:absolute;right:16px;top:76px;width:330px;background:rgba(255,255,255,.96);border:1px solid var(--border);border-radius:16px;box-shadow:0 14px 40px rgba(0,0,0,.14);padding:14px;display:none;z-index:10;cursor:auto}.panel.open{display:block}.panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.panel h2{font-size:15px;margin:0;font-weight:780}.field{display:grid;gap:6px;margin:10px 0}.field label{font-size:12px;color:var(--muted);font-weight:700}.field input,.field textarea,.field select{width:100%;border:1px solid var(--border);border-radius:10px;background:#fff;color:var(--text);padding:9px 10px;font-size:14px}.field textarea{min-height:78px;resize:vertical;line-height:1.45}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.panel-actions{display:flex;gap:8px;justify-content:space-between;margin-top:12px}.danger{color:var(--red)}
.port{position:absolute;width:14px;height:14px;border-radius:50%;background:#fff;border:2px solid var(--blue);box-shadow:0 1px 3px rgba(0,0,0,.18);opacity:0;transform:translate(-50%,-50%);cursor:crosshair;z-index:3;transition:opacity .12s,transform .12s;pointer-events:auto}.card:hover .port,.card.selected .port,.board.connecting .port{opacity:1}.port:hover,.port.target{transform:translate(-50%,-50%) scale(1.4);background:var(--blue-soft)}.port[data-side=top]{left:50%;top:0}.port[data-side=right]{left:100%;top:50%}.port[data-side=bottom]{left:50%;top:100%}.port[data-side=left]{left:0;top:50%}
.wires{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible;pointer-events:none}.wires .hit{fill:none;stroke:transparent;stroke-width:16;pointer-events:stroke;cursor:pointer}.wires .line{fill:none;stroke:#858078;stroke-width:2.5;stroke-linecap:round;pointer-events:none}.wires g.selected .line{stroke:var(--blue);stroke-width:3}.wires .temp{fill:none;stroke:var(--blue);stroke-width:2.5;stroke-dasharray:6 6;stroke-linecap:round;pointer-events:none}
.wire-delete{position:absolute;width:26px;height:26px;border-radius:50%;border:1px solid var(--border);background:#fff;color:var(--red);font-size:14px;font-weight:700;display:grid;place-items:center;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.14);transform:translate(-50%,-50%);z-index:4;min-height:0;padding:0}
.export-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:24px}.export-overlay.show{display:flex}.export-box{background:#fff;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.3);padding:14px;max-width:min(920px,92vw);max-height:88vh;display:flex;flex-direction:column;gap:10px}.export-head{display:flex;align-items:center;justify-content:space-between;gap:12px}.export-actions{display:flex;align-items:center;gap:10px}.export-actions a{font-size:13px;color:var(--blue);font-weight:650;text-decoration:none}.export-box img{max-width:100%;max-height:64vh;object-fit:contain;border:1px solid var(--border);border-radius:10px;background:#fff}.export-note{font-size:12px;color:var(--muted)}
@media(max-width:720px){header{height:auto;align-items:flex-start}.tools{gap:6px}button{min-height:34px;padding:0 10px}.sub{display:none}.hint{display:none}.panel{left:12px;right:12px;top:76px;width:auto}}
@media(prefers-color-scheme:dark){:root{--bg:#191919;--grid:rgba(255,255,255,.08);--text:#fff;--muted:rgba(255,255,255,.65);--border:rgba(255,255,255,.18);--shadow:0 1px 2px rgba(0,0,0,.25),0 10px 28px rgba(0,0,0,.24);--blue:#5e9fe8;--blue-soft:rgba(94,159,232,.14);--green:#72bc8f;--green-soft:rgba(114,188,143,.14);--orange:#de9255;--orange-soft:rgba(222,146,85,.14);--red:#e97366;--red-soft:rgba(233,115,102,.14)}header,.hint,button,.panel,.field input,.field textarea,.field select{background:rgba(32,32,32,.94)}.card{background:rgba(32,32,32,.95)}.port,.wire-delete{background:#2a2a2a}.export-box{background:#242424}.wires .line{stroke:#96918a}.body{color:rgba(255,255,255,.72)}}

:root{--muted:#68645f;--blue:#1765a8;--green:#286d4c;--orange:#985218;--red:#b5352f}
button{font-size:14px;min-height:44px;border-radius:8px}button:focus-visible,select:focus-visible,[contenteditable]:focus-visible,.resize:focus-visible{outline:2px solid var(--blue);outline-offset:3px}.version{color:var(--muted);font-weight:500}.sub,.hint,.field label,.zoom,.export-note{font-size:14px}.sub{max-width:420px}header{height:auto;min-height:72px;padding:12px 16px}.tools{gap:4px}.card{border-radius:12px}.top{gap:4px;align-items:center}.actions{gap:0}.mini{width:44px;height:44px;min-height:44px;color:#68645f}.tag{font:650 14px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;display:block;min-width:24px;min-height:32px;max-width:calc(100% - 48px);padding:5px 8px;overflow-wrap:anywhere;cursor:text;user-select:text;white-space:pre-wrap}.tag:empty:before{content:attr(data-placeholder)}.body{font-size:16px;line-height:1.5;color:#45423e;min-height:72px;white-space:pre-wrap;overflow-wrap:anywhere;cursor:text;user-select:text;touch-action:auto;padding:4px 0}.body:empty:before{content:attr(data-placeholder);color:var(--muted)}[contenteditable]:hover{box-shadow:0 0 0 1px var(--border);border-radius:4px}[contenteditable]:focus{outline:2px solid var(--blue);outline-offset:4px;border-radius:4px}.card.editing{border-color:var(--blue);cursor:default}.resize{width:28px;height:28px;right:2px;bottom:2px;color:#68645f}.panel{top:12px;border-radius:12px;background:#fff}.panel-actions{flex-wrap:wrap;gap:6px}.hint{max-width:calc(100% - 32px);line-height:1.5}.title{display:none}#storageNotice{position:absolute;bottom:64px;left:16px;right:16px;padding:12px;background:#fbebde;color:#713d12;border:1px solid #985218;border-radius:8px;font-size:14px;z-index:20}.export-box{border-radius:12px}.export-actions{flex-wrap:wrap}.export-overlay{padding:16px}
@media(max-width:1000px){header{flex-wrap:wrap}.brand{flex:1 0 100%}.tools{justify-content:flex-start}.sub{max-width:none}.hint{display:none}}
@media(max-width:720px){header{padding:12px}.tools{gap:4px}.tools button{padding:0 9px;min-height:44px}.zoom{min-width:44px}.card{--cw:unset}.panel{top:12px;max-height:calc(100% - 24px);overflow:auto}.export-head{align-items:flex-start}.export-actions a{font-size:14px}.sub{display:block;font-size:14px;white-space:normal}.app{min-height:0;height:100dvh}}
@media(prefers-color-scheme:dark){:root{--blue:#5e9fe8;--green:#72bc8f;--orange:#de9255;--red:#e97366;--muted:rgba(255,255,255,.7)}.panel{background:#202020}.body,.mini,.resize{color:rgba(255,255,255,.85)}.tag.gray{background:#383836;color:#eee}.primary{background:#fff;color:#202020}.primary:hover{background:#ddd;color:#202020}.mini:hover,button:hover{background:#383836;color:#fff}.export-note{color:rgba(255,255,255,.7)}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body><div class="app"><header><div class="brand"><span class="dot"></span><div><h1>インタラクティブボード <span class="version">v2</span></h1><div class="sub">タグ・本文をクリックして直接入力。余白をドラッグして移動。</div></div></div><div class="tools"><button class="primary" id="add">＋ カード</button><button id="zoomOut">−</button><span class="zoom" id="zoomLabel">100%</span><button id="zoomIn">＋</button><button id="importJson" title="JSONファイルを読み込んでボードを置き換え">読込</button><button id="exportJson" title="ボードのデータをJSONで書き出し">JSON</button><button id="exportPng" title="全カードをPNG画像で書き出し">PNG</button><button class="ghost" id="reset">リセット</button></div></header><main class="board-wrap"><div class="board" id="board"><div class="stage" id="stage"></div><div class="hint">タグ・本文：直接入力・自動保存 ／ カードの余白：移動 ／ Shift＋余白クリック：複数選択 ／ 4辺の●：線で接続</div><section class="panel" id="panel" aria-label="カード編集"><div class="panel-head"><h2>カード設定</h2><button class="mini" id="closePanel" type="button" aria-label="閉じる">×</button></div><div class="row"><div class="field"><label for="toneInput">タグ色</label><select id="toneInput"><option value="blue">Blue</option><option value="green">Green</option><option value="orange">Orange</option><option value="red">Red</option><option value="gray">Gray</option></select></div><div class="field"><label for="sizeInput">サイズ</label><select id="sizeInput"><option value="220x120">小</option><option value="260x140">中</option><option value="330x160">大</option><option value="420x190">ワイド</option></select></div></div><div class="panel-actions"><button id="duplicateCard" type="button">複製</button><button class="danger" id="deleteCard" type="button">削除</button><button class="primary" id="doneEdit" type="button">完了</button></div></section></div></main></div>
<div class="export-overlay" id="exportOverlay"><div class="export-box"><div class="export-head"><strong>PNG書き出し</strong><span class="export-actions"><a id="exportOpen" target="_blank" rel="noopener">別タブで開く</a><button class="mini" id="exportClose" type="button" aria-label="閉じる">×</button></span></div><img id="exportImg" alt="書き出しプレビュー"><div class="export-note">ダウンロードが始まらない場合は、画像を右クリック（長押し）して保存してください。</div></div></div>
<div class="export-overlay" id="jsonOverlay"><div class="export-box"><div class="export-head"><strong>JSON書き出し</strong><span class="export-actions"><a id="jsonOpen" target="_blank" rel="noopener">別タブで開く</a><button class="mini" id="jsonClose" type="button" aria-label="閉じる">×</button></span></div><div class="export-note">board-data-v2.json のダウンロードを実行しました。始まらない場合は「別タブで開く」からページを保存してください。読み込みは「読込」ボタンか、ボードへのドラッグ＆ドロップで行えます。</div></div></div>
<div class="export-overlay" id="confirmOverlay"><div class="export-box"><div class="export-head"><strong id="confirmMsg">置き換えますか？</strong></div><div class="export-actions" style="justify-content:flex-end"><button class="mini" id="confirmNo" type="button" style="width:auto;padding:0 12px">キャンセル</button><button class="mini" id="confirmYes" type="button" style="width:auto;padding:0 12px;background:#2c2c2b;color:#fff;border-color:#2c2c2b">置き換える</button></div></div></div>
<input type="file" id="jsonFile" accept=".json,application/json" style="display:none">
<script>
const $=s=>document.querySelector(s);const stage=$('#stage'),board=$('#board'),zoomLabel=$('#zoomLabel'),panel=$('#panel');
const toneInput=$('#toneInput'),sizeInput=$('#sizeInput');
const STORAGE_KEY='interactive-board-v2-inline';
function migrateCard(c){const n={...c};if(n.contentVersion!==2){if(typeof n.title==='string'&&n.title){n.legacyTitle=n.title;n.body=n.title+(n.body?'\n\n'+n.body:'');}delete n.title;n.contentVersion=2;}n.body=String(n.body??'');n.tag=String(n.tag??'TAG');return n;}
function migrateBoard(b){return {...b,cards:b.cards.map(migrateCard),connections:b.connections||[]};}
const initial={scale:1,panX:0,panY:0,connections:[{id:9001,from:{id:1,side:'right'},to:{id:2,side:'top'}}],cards:[{id:1,x:72,y:48,w:330,h:156,tag:'PRODUCT BRAINSTORM',tone:'blue',title:'Move the ideas\naround.',body:'Drag any card freely on the canvas to cluster, rank, or remix concepts.'},{id:2,x:335,y:220,w:240,h:128,tag:'Activation',tone:'blue',title:'Smart onboarding',body:'Personalize first-week setup based on role, team size, and initial goal.'},{id:3,x:780,y:150,w:240,h:128,tag:'Risk',tone:'red',title:'Team health radar',body:'Spot overloaded projects, stale owners, and decisions waiting too long.'},{id:4,x:1120,y:78,w:260,h:140,tag:'Retention',tone:'green',title:'AI summary feed',body:'Daily digest that turns messy project activity into crisp decisions and blockers.'},{id:5,x:1660,y:125,w:260,h:140,tag:'Growth',tone:'orange',title:'Template marketplace',body:'Curated starter systems customers can clone, adapt, and upgrade from.'},{id:6,x:1770,y:420,w:260,h:140,tag:'Power user',tone:'gray',title:'Command palette',body:'One shortcut to find, create, update, or trigger the next useful action.'}]};
let state=migrateBoard(structuredClone(initial)),selectedId=null,drag=null,selIds=new Set(),storageWarning=false,loadedSaved=false;try{const saved=localStorage.getItem(STORAGE_KEY)||localStorage.getItem('interactive-board-v3');if(saved){const candidate=JSON.parse(saved);if(Array.isArray(candidate.cards)){state=migrateBoard(candidate);loadedSaved=true;}}}catch(e){storageWarning=true;}state.connections=state.connections||[];let selectedWire=null;
function storageNotice(){if(document.querySelector('#storageNotice'))return;const el=document.createElement('div');el.id='storageNotice';el.setAttribute('role','status');el.textContent='自動保存できません。JSONで書き出して保存してください。';document.querySelector('.board-wrap').appendChild(el);}
function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));}catch(e){storageNotice();}}function esc(s){return String(s).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))}function nl(s){return esc(s).replace(/\n/g,'<br>')}function getCard(id=selectedId){return state.cards.find(c=>c.id==id)}function nearestSize(c){const sizes=[[220,120],[260,140],[330,160],[420,190]];let best=sizes[0],score=1e9;for(const s of sizes){const d=Math.abs((c.w||260)-s[0])+Math.abs((c.h||140)-s[1]);if(d<score){score=d;best=s}}return best.join('x')}
function render(){stage.style.transform=`translate(${state.panX}px,${state.panY}px) scale(${state.scale})`;board.style.setProperty('--gx',`${state.panX%24}px`);board.style.setProperty('--gy',`${state.panY%24}px`);zoomLabel.textContent=Math.round(state.scale*100)+'%';stage.innerHTML='<svg class="wires" id="wires"></svg>';state.cards.forEach(c=>{const el=document.createElement('article');el.className='card'+((c.id===selectedId||selIds.has(c.id))?' selected':'');el.dataset.id=c.id;el.style.left=c.x+'px';el.style.top=c.y+'px';el.style.setProperty('--cw',(c.w||260)+'px');el.style.setProperty('--ch',(c.h||140)+'px');el.innerHTML=`<div class="top"><span class="tag ${['blue','green','orange','red','gray'].includes(c.tone)?c.tone:'gray'}" contenteditable="plaintext-only" role="textbox" aria-label="タグ" data-field="tag" data-placeholder="タグ" spellcheck="false"></span><span class="actions"><button class="mini" data-action="edit" type="button" aria-label="カード設定" title="タグ色・サイズ">⋯</button></span></div><div class="body" contenteditable="plaintext-only" role="textbox" aria-label="本文" aria-multiline="true" data-field="body" data-placeholder="本文を入力…" spellcheck="false"></div><span class="resize" data-action="resize" role="button" tabindex="0" aria-label="サイズ変更" title="ドラッグまたは矢印キーでサイズ変更">◢</span><span class="port" data-side="top" title="接続点 上"></span><span class="port" data-side="right" title="接続点 右"></span><span class="port" data-side="bottom" title="接続点 下"></span><span class="port" data-side="left" title="接続点 左"></span>`;el.querySelector('[data-field="tag"]').textContent=c.tag;el.querySelector('[data-field="body"]').textContent=c.body;stage.appendChild(el)});drawWires()}

function portPoint(id,side){const el=stage.querySelector(`.card[data-id="${id}"]`);if(!el)return null;const x=el.offsetLeft,y=el.offsetTop,w=el.offsetWidth,h=el.offsetHeight;if(side==='top')return{x:x+w/2,y:y};if(side==='right')return{x:x+w,y:y+h/2};if(side==='bottom')return{x:x+w/2,y:y+h};return{x:x,y:y+h/2}}
function opposite(s){return{top:'bottom',bottom:'top',left:'right',right:'left'}[s]}
function wirePath(p1,s1,p2,s2){const dir={top:[0,-1],right:[1,0],bottom:[0,1],left:[-1,0]};const k=Math.max(46,Math.hypot(p2.x-p1.x,p2.y-p1.y)*.38);return`M${p1.x} ${p1.y} C${p1.x+dir[s1][0]*k} ${p1.y+dir[s1][1]*k},${p2.x+dir[s2][0]*k} ${p2.y+dir[s2][1]*k},${p2.x} ${p2.y}`}
function nearestSide(el,p){const x=el.offsetLeft,y=el.offsetTop,w=el.offsetWidth,h=el.offsetHeight;const d={left:Math.abs(p.x-x),right:Math.abs(x+w-p.x),top:Math.abs(p.y-y),bottom:Math.abs(y+h-p.y)};return Object.keys(d).sort((a,b)=>d[a]-d[b])[0]}
function stagePoint(e){const r=board.getBoundingClientRect();return{x:(e.clientX-r.left-state.panX)/state.scale,y:(e.clientY-r.top-state.panY)/state.scale}}
function deleteWire(id){state.connections=state.connections.filter(w=>w.id!==id);selectedWire=null;save();drawWires()}
function drawWires(){const svg=stage.querySelector('#wires');if(!svg)return;let html='';state.connections.forEach(w=>{const p1=portPoint(w.from.id,w.from.side),p2=portPoint(w.to.id,w.to.side);if(!p1||!p2)return;const d=wirePath(p1,w.from.side,p2,w.to.side);html+=`<g data-wire="${w.id}" class="${w.id===selectedWire?'selected':''}"><path class="hit" d="${d}"/><path class="line" d="${d}"/></g>`});if(drag&&drag.type==='connect'&&drag.cur){const p1=portPoint(drag.fromId,drag.fromSide);if(p1)html+=`<path class="temp" d="${wirePath(p1,drag.fromSide,drag.cur,opposite(drag.fromSide))}"/>`}svg.innerHTML=html;const old=stage.querySelector('.wire-delete');if(old)old.remove();if(selectedWire!=null){const w=state.connections.find(x=>x.id===selectedWire);if(w){const p1=portPoint(w.from.id,w.from.side),p2=portPoint(w.to.id,w.to.side);if(p1&&p2){const btn=document.createElement('button');btn.className='wire-delete';btn.type='button';btn.title='線を削除';btn.textContent='×';btn.style.left=(p1.x+p2.x)/2+'px';btn.style.top=(p1.y+p2.y)/2+'px';btn.addEventListener('pointerdown',ev=>{ev.stopPropagation();ev.preventDefault();deleteWire(w.id)});stage.appendChild(btn)}}}}
function openEditor(id){selectedId=id;selIds=new Set([id]);const c=getCard();if(!c)return;toneInput.value=c.tone||'gray';sizeInput.value=nearestSize(c);syncEditor.lastSize=sizeInput.value;panel.classList.add('open');render();toneInput.focus()}
function syncEditor(){const c=getCard();if(!c)return;c.tone=toneInput.value;const [w,h]=sizeInput.value.split('x').map(Number);if(syncEditor.lastSize!==sizeInput.value){c.w=w;c.h=h;syncEditor.lastSize=sizeInput.value;}save();render()}

function closeEditor(){syncEditor();panel.classList.remove('open');selectedId=null;selIds.clear();render()}function deleteCardById(id){state.cards=state.cards.filter(c=>c.id!==id);state.connections=state.connections.filter(w=>w.from.id!==id&&w.to.id!==id);if(selectedId===id){selectedId=null;panel.classList.remove('open')}selIds.delete(id);save();render()}function duplicateCard(id){const c=getCard(id);if(!c)return;const copy={...structuredClone(c),id:Date.now(),x:c.x+32,y:c.y+32,contentVersion:2};state.cards.push(copy);selectedId=copy.id;selIds=new Set([copy.id]);save();render()}function deleteSelected(){if(!selectedId)return;selIds.delete(selectedId);state.cards=state.cards.filter(c=>c.id!==selectedId);state.connections=state.connections.filter(w=>w.from.id!==selectedId&&w.to.id!==selectedId);selectedId=null;panel.classList.remove('open');save();render()}
function deleteSelectedCards(){if(!selIds.size)return;state.cards=state.cards.filter(c=>!selIds.has(c.id));state.connections=state.connections.filter(w=>!selIds.has(w.from.id)&&!selIds.has(w.to.id));if(selectedId!=null&&!getCard(selectedId)){selectedId=null;panel.classList.remove('open')}selIds.clear();save();render()}
function rrect(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
function wrapText(g,text,maxW){const out=[];let cur='';const units=[];(String(text).match(/\s+|\S+/g)||[]).forEach(t=>{if(/\s/.test(t)){units.push(t)}else if(/^[\x00-\x7F]+$/.test(t)&&g.measureText(t).width<=maxW){units.push(t)}else{for(const ch of t)units.push(ch)}});units.forEach(u=>{if(g.measureText(cur+u).width>maxW&&cur.trim()){out.push(cur.replace(/\s+$/,''));cur=/^\s+$/.test(u)?'':u}else{cur+=u}});out.push(cur);return out}
function exportPng(){const els=[...stage.querySelectorAll('.card')];if(!els.length)return;const M=48,S=2;let minX=1e9,minY=1e9,maxX=-1e9,maxY=-1e9;const boxes=els.map(el=>{const b={id:+el.dataset.id,x:el.offsetLeft,y:el.offsetTop,w:el.offsetWidth,h:el.offsetHeight};minX=Math.min(minX,b.x);minY=Math.min(minY,b.y);maxX=Math.max(maxX,b.x+b.w);maxY=Math.max(maxY,b.y+b.h);return b});const W=maxX-minX+M*2,H=maxY-minY+M*2;const cv=document.createElement('canvas');cv.width=Math.round(W*S);cv.height=Math.round(H*S);const g=cv.getContext('2d');g.scale(S,S);g.translate(M-minX,M-minY);g.fillStyle='#f9f8f7';g.fillRect(minX-M,minY-M,W,H);g.strokeStyle='#e6e5e3';g.lineWidth=1;for(let x=Math.floor((minX-M)/24)*24;x<=minX-M+W;x+=24){g.beginPath();g.moveTo(x,minY-M);g.lineTo(x,minY-M+H);g.stroke()}for(let y=Math.floor((minY-M)/24)*24;y<=minY-M+H;y+=24){g.beginPath();g.moveTo(minX-M,y);g.lineTo(minX-M+W,y);g.stroke()}const dir={top:[0,-1],right:[1,0],bottom:[0,1],left:[-1,0]};g.strokeStyle='#858078';g.lineWidth=2.5;g.lineCap='round';state.connections.forEach(w=>{const p1=portPoint(w.from.id,w.from.side),p2=portPoint(w.to.id,w.to.side);if(!p1||!p2)return;const k=Math.max(46,Math.hypot(p2.x-p1.x,p2.y-p1.y)*.38);g.beginPath();g.moveTo(p1.x,p1.y);g.bezierCurveTo(p1.x+dir[w.from.side][0]*k,p1.y+dir[w.from.side][1]*k,p2.x+dir[w.to.side][0]*k,p2.y+dir[w.to.side][1]*k,p2.x,p2.y);g.stroke()});const tones={blue:['#2783de','#e5f2fc'],green:['#46a171','#e8f1ec'],orange:['#d5803b','#fbebde'],red:['#e56458','#fce9e7'],gray:['#6f6a65','#f0efed']};const font='-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif';boxes.forEach(b=>{const c=getCard(b.id);if(!c)return;g.save();g.shadowColor='rgba(0,0,0,.10)';g.shadowBlur=14;g.shadowOffsetY=5;g.fillStyle='#ffffff';rrect(g,b.x,b.y,b.w,b.h,14);g.fill();g.restore();g.strokeStyle='#e6e5e3';g.lineWidth=1;rrect(g,b.x,b.y,b.w,b.h,14);g.stroke();const t=tones[c.tone||'gray']||tones.gray;const tag=String(c.tag||'TAG');g.font='650 14px '+font;const tw=g.measureText(tag).width;g.fillStyle=t[1];rrect(g,b.x+14,b.y+14,Math.min(tw+16,b.w-28),32,7);g.fill();g.fillStyle=t[0];g.textBaseline='middle';g.fillText(tag,b.x+22,b.y+30);g.textBaseline='alphabetic';g.font='400 16px '+font;g.fillStyle='#45423e';let ty=b.y+14+Math.max(44,stage.querySelector(`.card[data-id="${c.id}"] .top`).offsetHeight)+8+17;String(c.body||'').split('\n').forEach(line=>{wrapText(g,line,b.w-28).forEach(l=>{g.fillText(l,b.x+14,ty);ty+=24})})});const finish=url=>{try{const a=document.createElement('a');a.download='interactive-board-v2.png';a.href=url;document.body.appendChild(a);a.click();a.remove()}catch(_){}const ov=$('#exportOverlay');$('#exportImg').src=url;$('#exportOpen').href=url;ov.classList.add('show')};if(cv.toBlob){cv.toBlob(b=>finish(URL.createObjectURL(b)),'image/png')}else{finish(cv.toDataURL('image/png'))}}
function customConfirm(msg,okLabel,showCancel){return new Promise(res=>{const ov=$('#confirmOverlay');$('#confirmMsg').textContent=msg;const yes=$('#confirmYes'),no=$('#confirmNo');yes.textContent=okLabel||'置き換える';no.style.display=showCancel===false?'none':'';const close=r=>{ov.classList.remove('show');yes.onclick=null;no.onclick=null;res(r)};yes.onclick=()=>close(true);no.onclick=()=>close(false);ov.classList.add('show')})}
function exportJson(){const data={app:'interactive-board',version:2,exportedAt:new Date().toISOString(),cards:state.cards,connections:state.connections};const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));try{const a=document.createElement('a');a.download='board-data-v2.json';a.href=url;document.body.appendChild(a);a.click();a.remove()}catch(_){}$('#jsonOpen').href=url;$('#jsonOverlay').classList.add('show')}
async function applyJsonText(text){let data;try{data=JSON.parse(text)}catch(_){await customConfirm('JSONの解析に失敗しました。ファイルを確認してください。','OK',false);return}if(!data||data.app!=='interactive-board'||!Array.isArray(data.cards)){await customConfirm('このファイルはインタラクティブボードのJSONではありません。','OK',false);return}if(!(await customConfirm(`読み込んだ内容（カード${data.cards.length}枚）で現在のボードを置き換えますか？`)))return;state.cards=data.cards.map(migrateCard);state.connections=Array.isArray(data.connections)?data.connections:[];selectedId=null;selectedWire=null;selIds.clear();panel.classList.remove('open');save();render()}
function readJsonFile(f){if(!f)return;const r=new FileReader();r.onload=()=>applyJsonText(r.result);r.readAsText(f)}
panel.addEventListener('pointerdown',e=>e.stopPropagation());panel.addEventListener('click',e=>e.stopPropagation());[toneInput,sizeInput].forEach(el=>el.addEventListener('input',syncEditor));$('#doneEdit').addEventListener('click',closeEditor);$('#closePanel').addEventListener('click',closeEditor);$('#deleteCard').addEventListener('click',deleteSelected);$('#duplicateCard').onclick=()=>{const id=selectedId;panel.classList.remove('open');duplicateCard(id)};
board.addEventListener('pointerdown',e=>{if(e.target.closest('[contenteditable]')){if(e.shiftKey&&!e.target.isContentEditable)return;e.stopPropagation();return;}if(e.target.closest('.panel'))return;const port=e.target.closest?e.target.closest('.port'):null;if(port){e.preventDefault();e.stopPropagation();drag={type:'connect',fromId:+port.closest('.card').dataset.id,fromSide:port.dataset.side,cur:stagePoint(e)};board.classList.add('connecting');board.setPointerCapture(e.pointerId);drawWires();return}const hit=e.target.closest?e.target.closest('g[data-wire]'):null;if(hit){e.stopPropagation();selectedWire=+hit.dataset.wire;drawWires();return}if(selectedWire!=null){selectedWire=null;drawWires()}const action=e.target.closest('[data-action]');if(action?.dataset.action==='edit'){e.preventDefault();e.stopPropagation();openEditor(+action.closest('.card').dataset.id);return}if(action?.dataset.action==='delete'){e.preventDefault();e.stopPropagation();deleteCardById(+action.closest('.card').dataset.id);return}if(action?.dataset.action==='duplicate'){e.preventDefault();e.stopPropagation();duplicateCard(+action.closest('.card').dataset.id);return}if(action?.dataset.action==='resize'){e.preventDefault();e.stopPropagation();const cardEl=action.closest('.card'),c=getCard(+cardEl.dataset.id);selectedId=c.id;drag={type:'resize',id:c.id,sx:e.clientX,sy:e.clientY,ow:cardEl.offsetWidth,oh:cardEl.offsetHeight};board.setPointerCapture(e.pointerId);render();return}const card=e.target.closest('.card');if(card){const id=+card.dataset.id;if(e.shiftKey){e.preventDefault();if(selIds.has(id)){selIds.delete(id);if(selectedId===id)selectedId=null}else{selIds.add(id)}render();return}if(!selIds.has(id))selIds=new Set([id]);selectedId=id;const orig={};selIds.forEach(i=>{const cc=getCard(i);if(cc)orig[i]={x:cc.x,y:cc.y}});drag={type:'card',ids:[...selIds],sx:e.clientX,sy:e.clientY,orig};board.setPointerCapture(e.pointerId);card.classList.add('dragging');render();return}if(selIds.size||selectedId!=null){selIds.clear();if(!panel.classList.contains('open'))selectedId=null;render()}drag={type:'pan',sx:e.clientX,sy:e.clientY,ox:state.panX,oy:state.panY};board.setPointerCapture(e.pointerId)});
board.addEventListener('pointermove',e=>{if(!drag)return;if(drag.type==='connect'){drag.cur=stagePoint(e);document.querySelectorAll('.port.target').forEach(p=>p.classList.remove('target'));const t=document.elementFromPoint(e.clientX,e.clientY);const tp=t&&t.closest?t.closest('.port'):null;if(tp&&tp.closest('.card')&&+tp.closest('.card').dataset.id!==drag.fromId)tp.classList.add('target');drawWires();return}if(drag.type==='card'){const dx=(e.clientX-drag.sx)/state.scale,dy=(e.clientY-drag.sy)/state.scale;drag.ids.forEach(i=>{const c=getCard(i),o=drag.orig[i];if(!c||!o)return;c.x=Math.round(o.x+dx);c.y=Math.round(o.y+dy);const el=document.querySelector(`.card[data-id="${i}"]`);if(el){el.style.left=c.x+'px';el.style.top=c.y+'px'}});drawWires()}else if(drag.type==='resize'){const c=getCard(drag.id);c.w=Math.max(180,Math.round(drag.ow+(e.clientX-drag.sx)/state.scale));c.h=Math.max(105,Math.round(drag.oh+(e.clientY-drag.sy)/state.scale));const el=document.querySelector(`.card[data-id="${c.id}"]`);if(el){el.style.setProperty('--cw',c.w+'px');el.style.setProperty('--ch',c.h+'px')}drawWires()}else{state.panX=drag.ox+e.clientX-drag.sx;state.panY=drag.oy+e.clientY-drag.sy;stage.style.transform=`translate(${state.panX}px,${state.panY}px) scale(${state.scale})`;board.style.setProperty('--gx',`${state.panX%24}px`);board.style.setProperty('--gy',`${state.panY%24}px`)}});
board.addEventListener('pointerup',e=>{if(!drag)return;if(drag&&drag.type==='connect'){const t=document.elementFromPoint(e.clientX,e.clientY);const tp=t&&t.closest?t.closest('.port'):null;const cardEl=tp?tp.closest('.card'):(t&&t.closest?t.closest('.card'):null);if(cardEl&&+cardEl.dataset.id!==drag.fromId){const toId=+cardEl.dataset.id,side=tp?tp.dataset.side:nearestSide(cardEl,stagePoint(e));const dup=state.connections.some(w=>(w.from.id===drag.fromId&&w.from.side===drag.fromSide&&w.to.id===toId&&w.to.side===side)||(w.to.id===drag.fromId&&w.to.side===drag.fromSide&&w.from.id===toId&&w.from.side===side));if(!dup)state.connections.push({id:Date.now(),from:{id:drag.fromId,side:drag.fromSide},to:{id:toId,side:side}})}board.classList.remove('connecting');drag=null;save();render();return}drag=null;save();render()});board.addEventListener('dblclick',e=>{if(e.target.closest('[contenteditable]'))return;const card=e.target.closest('.card');if(card)openEditor(+card.dataset.id)});
$('#add').onclick=()=>{const id=Date.now();state.cards.push({id,x:Math.round((-state.panX+Math.min(180,Math.max(24,(board.clientWidth-260*state.scale)/2)))/state.scale),y:Math.round((-state.panY+120)/state.scale),w:260,h:140,tag:'NEW',tone:'gray',body:'',contentVersion:2});save();render();stage.querySelector(`.card[data-id="${id}"] [data-field="body"]`).focus()};$('#zoomIn').onclick=()=>{state.scale=Math.min(1.6,+(state.scale+.1).toFixed(2));save();render()};$('#zoomOut').onclick=()=>{state.scale=Math.max(.55,+(state.scale-.1).toFixed(2));save();render()};$('#reset').onclick=async()=>{if(!(await customConfirm('現在のカードと接続線をすべて削除しますか？','削除する')))return;state={scale:1,panX:0,panY:0,cards:[],connections:[]};selectedId=null;selectedWire=null;selIds.clear();panel.classList.remove('open');save();render()};
$('#exportPng').onclick=exportPng;$('#exportClose').onclick=()=>$('#exportOverlay').classList.remove('show');$('#exportOverlay').addEventListener('pointerdown',e=>{if(e.target.id==='exportOverlay')$('#exportOverlay').classList.remove('show')});
$('#exportJson').onclick=exportJson;$('#importJson').onclick=()=>$('#jsonFile').click();$('#jsonFile').addEventListener('change',e=>{readJsonFile(e.target.files[0]);e.target.value=''});$('#jsonClose').onclick=()=>$('#jsonOverlay').classList.remove('show');$('#jsonOverlay').addEventListener('pointerdown',e=>{if(e.target.id==='jsonOverlay')$('#jsonOverlay').classList.remove('show')});board.addEventListener('dragover',e=>{e.preventDefault()});board.addEventListener('drop',e=>{e.preventDefault();const f=e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0];if(f&&/\.json$/i.test(f.name))readJsonFile(f)});
window.addEventListener('keydown',e=>{if((e.key==='Delete'||e.key==='Backspace')&&!e.target.isContentEditable&&!/input|textarea|select/i.test(e.target.tagName)){if(selectedWire!=null){e.preventDefault();deleteWire(selectedWire)}else if(selIds.size){e.preventDefault();deleteSelectedCards()}}});

board.addEventListener('input',e=>{const el=e.target.closest('[data-field]');if(!el)return;const c=getCard(+el.closest('.card').dataset.id);if(!c)return;c[el.dataset.field]=el.innerText.replace(/\r\n/g,'\n');c.contentVersion=2;save();drawWires();});
board.addEventListener('focusin',e=>{if(e.target.isContentEditable)e.target.closest('.card').classList.add('editing')});
board.addEventListener('focusout',e=>{if(e.target.isContentEditable){e.target.closest('.card')?.classList.remove('editing');save();drawWires();}});
board.addEventListener('keydown',e=>{if(e.target.isContentEditable){if(e.target.dataset.field==='tag'&&e.key==='Enter'){e.preventDefault();e.target.blur();}if(e.key==='Escape'){e.preventDefault();e.target.blur();}return;}if(e.target.matches('.resize')&&['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)){e.preventDefault();const c=getCard(+e.target.closest('.card').dataset.id);c.w=Math.max(180,c.w+({ArrowLeft:-10,ArrowRight:10}[e.key]||0));c.h=Math.max(105,c.h+({ArrowUp:-10,ArrowDown:10}[e.key]||0));save();const el=e.target.closest('.card');el.style.setProperty('--cw',c.w+'px');el.style.setProperty('--ch',c.h+'px');drawWires();}});
board.addEventListener('pointercancel',()=>{if(!drag)return;drag=null;board.classList.remove('connecting');save();render();});
window.addEventListener('pagehide',save);
if(storageWarning)storageNotice();
if(!loadedSaved&&window.innerWidth<720)state.panX=24-state.cards[0].x;
render();
// Keep the starter text readable after title-to-body migration. Imported/saved coordinates are never changed.
if(!loadedSaved){for(let i=1;i<state.cards.length;i++){const c=state.cards[i];const el=stage.querySelector(`.card[data-id="${c.id}"]`);for(let j=0;j<i;j++){const prev=stage.querySelector(`.card[data-id="${state.cards[j].id}"]`);if(el.offsetLeft<prev.offsetLeft+prev.offsetWidth+16&&el.offsetLeft+el.offsetWidth+16>prev.offsetLeft&&c.y<prev.offsetTop+prev.offsetHeight+24&&c.y+el.offsetHeight>prev.offsetTop){c.y=prev.offsetTop+prev.offsetHeight+24;el.style.top=c.y+'px';}}}drawWires();}
